<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הסכמי קורפורייט ממשלה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="[https://fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Assistant:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F7;
  --surface:#FFFFFF;
  --surface-soft:#F8FAFC;
  --navy:#17324F;
  --navy-deep:#0B2036;
  --navy-mid:#34516E;
  --gold:#B88A43;
  --gold-soft:#F4E9D7;
  --gold-pale:#FBF6ED;
  --line:#DEE5EC;
  --line-strong:#CBD5DF;
  --text:#16283A;
  --muted:#637487;
  --subtle:#96A4B2;
  --red:#B8473D;
  --red-soft:#FFF0ED;
  --green:#2F7752;
  --green-soft:#EAF6EF;
  --shadow:0 10px 30px rgba(18,42,67,.08);
  --shadow-hover:0 18px 42px rgba(18,42,67,.13);
  --radius:16px;
  --serif:'Frank Ruhl Libre', serif;
  --sans:'Assistant', sans-serif;
  --mono:'JetBrains Mono', monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;padding-bottom:64px}
::selection{background:#ECD9B8;color:var(--navy-deep)}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid rgba(184,138,67,.38);outline-offset:2px}

/* ===== Hero ===== */
header{position:relative;overflow:hidden;background:linear-gradient(135deg,#0B2036 0%,#173A5D 72%,#1D486E 100%);padding:24px 24px 28px;color:#fff}
header::before{content:'';position:absolute;inset:auto auto -140px -90px;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(184,138,67,.22),transparent 67%);pointer-events:none}
.head-inner{max-width:1240px;margin:0 auto;position:relative}
.eyebrow{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:15px;color:#DFC797;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}
.eyebrow-left{display:flex;align-items:center;gap:9px}
.eyebrow .line{width:28px;height:1px;background:#DFC797;opacity:.65}
.head-controls{display:flex;gap:8px;flex-wrap:wrap}
.title-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px 24px;flex-wrap:wrap}
h1{margin:0;font-family:var(--serif);font-size:clamp(27px,4vw,40px);font-weight:700;line-height:1.05;letter-spacing:-.01em}
h1 em{font-style:normal;color:#DFC797;font-weight:400}
.stat-pill{display:flex;align-items:center;gap:5px;padding:8px 13px;border:1px solid rgba(255,255,255,.18);border-radius:999px;background:rgba(255,255,255,.07);font-size:12px;color:#D9E1E8;backdrop-filter:blur(8px)}
.stat-pill b{font-family:var(--mono);color:#fff}
.ctrl-btn{display:inline-flex;align-items:center;gap:7px;min-height:34px;padding:6px 11px;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:rgba(255,255,255,.06);color:#E9D7B4;font-size:11px;font-weight:700;cursor:pointer;transition:.16s ease}
.ctrl-btn svg{width:14px;height:14px}
.ctrl-btn:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.28)}
.ctrl-btn.on{background:#E6C993;color:#0B2036;border-color:#E6C993}

/* ===== Sticky workbench ===== */
.airline-bar{position:sticky;top:0;z-index:30;background:rgba(247,249,251,.94);backdrop-filter:blur(16px) saturate(1.25);border-bottom:1px solid var(--line);box-shadow:0 8px 30px rgba(12,32,54,.06)}
.toolbar-inner{max-width:1240px;margin:0 auto;padding:12px 24px 0;display:flex;align-items:center;gap:12px}
.search-shell{position:relative;display:flex;align-items:center;flex:1;max-width:620px}
.search-icon{position:absolute;right:14px;width:18px;height:18px;color:var(--muted);pointer-events:none}
#searchInput{width:100%;height:44px;padding:0 44px 0 86px;border:1px solid var(--line-strong);border-radius:12px;background:#fff;box-shadow:0 2px 8px rgba(18,42,67,.04);font-size:14px;font-weight:600;outline:none;transition:.16s ease}
#searchInput::placeholder{color:var(--subtle);font-weight:500}
#searchInput:focus{border-color:#C9A768;box-shadow:0 0 0 4px rgba(184,138,67,.12)}
.search-kbd{position:absolute;left:12px;display:inline-flex;align-items:center;justify-content:center;min-width:27px;height:24px;padding:0 7px;border:1px solid var(--line);border-bottom-color:#C8D1DB;border-radius:6px;background:#F6F8FA;color:var(--subtle);font:600 10px var(--mono)}
.clear-search{position:absolute;left:45px;width:28px;height:28px;border:0;border-radius:7px;background:transparent;color:var(--muted);display:none;place-items:center;cursor:pointer}
.clear-search.show{display:grid}
.clear-search:hover{background:#EEF2F6;color:var(--navy)}
.toolbar-note{margin-inline-start:auto;color:var(--muted);font-size:11px;white-space:nowrap}
.bar-inner{max-width:1240px;margin:0 auto;padding:10px 24px 13px;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}
.bar-inner::-webkit-scrollbar{display:none}
.chip{--ring:#fff;display:inline-flex;align-items:center;gap:8px;flex:none;min-height:38px;padding:4px 12px 4px 5px;background:#fff;border:1px solid var(--line);border-radius:999px;color:var(--navy);font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap;transition:.16s ease}
.chip:hover{border-color:#C6A768;transform:translateY(-1px)}
.chip.on{--ring:var(--navy);background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 4px 12px rgba(23,50,79,.18)}
.chip.inactive{opacity:.48;filter:grayscale(.85)}
.chip.inactive .chip-label{text-decoration:line-through;text-decoration-color:var(--red)}
.bubbles{display:flex;align-items:center;direction:ltr}
.bubble{width:29px;height:29px;border-radius:50%;flex:none;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 2px var(--ring);font:800 9px var(--mono);color:var(--navy-deep)}
.bubble+.bubble{margin-left:-8px}
.bubble img{width:78%;height:78%;object-fit:contain;display:block}
.bubble-more{background:var(--gold-soft);font-size:9px}
.bubble-all{background:#F1F5F8;color:var(--navy)}
.bubble-all svg{width:14px;height:14px}
.chip.on .bubble-all{background:#D9B978;color:#0B2036}
.chip-count{padding:1px 7px;border-radius:999px;background:#EFF3F6;color:var(--muted);font:700 10px var(--mono)}
.chip.on .chip-count{background:rgba(255,255,255,.14);color:#E8D3AA}

/* ===== Layout ===== */
main{max-width:1240px;margin:0 auto;padding:24px 24px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(410px,1fr));gap:18px;align-items:start}
.grid.single{grid-template-columns:minmax(0,760px);justify-content:center}

/* ===== Agreement card ===== */
.card{position:relative;overflow:hidden;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease,opacity .18s ease}
.card:not(.inactive):hover{transform:translateY(-2px);box-shadow:var(--shadow-hover)}
.card.editing{border-color:#C8A25D;box-shadow:0 0 0 3px rgba(184,138,67,.13),var(--shadow)}
.card.inactive{opacity:.58;filter:saturate(.35)}
.card-top{padding:18px 18px 16px;background:linear-gradient(140deg,#153654,#0D263E);color:#fff}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.card-title{min-width:0;flex:1}
.airline-name{margin:0;font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.25;color:#fff}
.codes{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px;direction:ltr;justify-content:flex-start}
.code-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px 3px 3px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.12);font:700 10.5px var(--mono);color:#F3E1BD}
.code-logo{width:21px;height:21px;border-radius:50%;background:#fff;object-fit:contain;padding:2px;display:block}
.code-logo.hidden{display:none}
.card-top-right{display:flex;align-items:flex-end;flex-direction:column;gap:9px;flex:none}
.active-toggle{display:flex;align-items:center;gap:7px;padding:0;border:0;background:transparent;color:#DDE6EE;font:700 10px var(--mono);cursor:pointer}
.switch{position:relative;width:34px;height:19px;border-radius:999px;background:#9E4541;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:.16s ease}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:.16s ease}
.active-toggle.is-active .switch{background:#3C825D}
.active-toggle.is-active .switch::after{transform:translateX(15px)}
.nofee-badge{padding:4px 8px;border-radius:7px;background:#DABA7A;color:#10283F;font:800 9px var(--mono);letter-spacing:.03em}
.edit-btn{width:30px;height:30px;border-radius:8px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);color:#E7D5B2;cursor:pointer;display:grid;place-items:center;transition:.16s ease}
.edit-btn:hover,.edit-btn.on{background:#DABA7A;color:#0B2036;border-color:#DABA7A}
.edit-btn svg{width:13px;height:13px}
.perf{display:none}
.stamp{position:absolute;top:61px;left:50%;transform:translateX(-50%) rotate(-8deg);z-index:5;display:none;padding:5px 12px;border:2px solid var(--red);border-radius:7px;background:rgba(255,240,237,.94);color:var(--red);font:800 14px var(--mono);letter-spacing:.08em;pointer-events:none}
.card.inactive .stamp{display:block}

.card-body{display:flex;flex-direction:column;gap:14px;padding:16px 18px 18px;flex:1}
.card-actions{display:flex;align-items:center;gap:8px;padding-bottom:2px}
.copy-all-btn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:7px 11px;border:1px solid #D6DEE6;border-radius:9px;background:#F8FAFC;color:var(--navy);font-size:11.5px;font-weight:800;cursor:pointer;transition:.16s ease}
.copy-all-btn svg{width:14px;height:14px}
.copy-all-btn:hover{border-color:#BE9A59;background:var(--gold-pale)}
.copy-all-btn.copied{background:var(--green-soft);border-color:#BBDDC9;color:var(--green)}
.action-hint{font-size:10.5px;color:var(--subtle)}
.fields{display:flex;flex-direction:column;gap:8px}
.field-block{padding:11px 12px;border:1px solid #E4E9EE;border-radius:11px;background:var(--surface-soft);display:flex;flex-direction:column;gap:5px}
.field-block+.field-block{border-top:1px solid #E4E9EE}
.field{display:flex;align-items:flex-start;gap:14px;justify-content:space-between}
.field-label{flex:0 0 36%;padding-top:5px;color:var(--muted);font-size:11px;font-weight:800;line-height:1.3}
.values{display:flex;flex:1;min-width:0;flex-direction:column;align-items:stretch;gap:6px}
.value-row{display:flex;align-items:center;gap:7px;min-width:0}
.field-value{flex:1;min-width:0;padding:5px 7px;border-radius:7px;color:#10283F;font:600 12.5px/1.45 var(--mono);direction:ltr;text-align:left;overflow-wrap:anywhere;transition:.14s ease}
.field-value:not(.is-editable){cursor:copy}
.field-value:not(.is-editable):hover{background:#EEF3F7}
.copy-btn{flex:none;width:32px;height:32px;border:1px solid #D5DEE6;border-radius:8px;background:#fff;color:#65788B;display:grid;place-items:center;cursor:pointer;transition:.14s ease}
.copy-btn svg{width:14px;height:14px}
.copy-btn:hover{border-color:#BE9A59;background:var(--gold-pale);color:var(--navy)}
.copy-btn.copied{background:var(--green);border-color:var(--green);color:#fff}
.field-note{padding-inline-start:calc(36% + 14px);color:var(--muted);font-size:10.5px;font-style:normal;line-height:1.45}
.section-label{margin-top:2px;color:#8A692F;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.dest-list{display:flex;flex-wrap:wrap;gap:6px;direction:ltr;justify-content:flex-start}
.dest-tag{padding:4px 8px;border:1px solid #E0E5EA;border-radius:7px;background:#F7F9FB;color:#476079;font:700 10px var(--mono)}
.benefits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.benefits li{position:relative;display:flex;align-items:flex-start;gap:8px;padding-right:17px;color:#4C6174;font-size:12px;line-height:1.5}
.benefits li::before{content:'✓';position:absolute;right:0;top:1px;color:var(--green);font-size:11px;font-weight:900}
.benefit-text{flex:1}
.note{padding:10px 12px;border:1px solid #E9D7B6;border-right:4px solid var(--gold);border-radius:9px;background:var(--gold-pale);color:#495D70;font-size:11.5px;line-height:1.55}
.note.warn{border-color:#F0C7C2;border-right-color:var(--red);background:var(--red-soft);color:#7B342E}
.remove-line-btn{flex:none;width:24px;height:24px;border:1px solid #E9B9B4;border-radius:7px;background:#FFF3F1;color:var(--red);display:grid;place-items:center;padding:0;font-size:15px;cursor:pointer}
.add-btn{align-self:flex-start;padding:5px 9px;border:1px dashed #CAA96C;border-radius:8px;background:var(--gold-pale);color:#8A692F;font:800 10.5px var(--mono);cursor:pointer}
.values .add-btn{align-self:flex-end}

/* edit mode */
.is-editable{outline:none;min-width:40px;background:#FFF7E9;border-bottom:1px dashed #B88A43;border-radius:4px;cursor:text}
.is-editable:focus{box-shadow:0 0 0 3px rgba(184,138,67,.13)}
.airline-name.is-editable{padding:2px 4px;background:rgba(255,247,233,.12);border-bottom-color:#E4C889}
[data-ph]:empty::before{content:attr(data-ph);color:var(--subtle);font-style:italic}
.airline-name[data-ph]:empty::before{color:#D8C6A6}
.edit-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:2px;padding-top:12px;border-top:1px dashed #D9C29A}
.edit-hint{flex:1;min-width:150px;color:var(--muted);font-size:10.5px}
.btn{min-height:36px;padding:7px 12px;border:1px solid var(--line-strong);border-radius:8px;background:#fff;color:var(--navy);font-weight:800;font-size:11.5px;cursor:pointer}
.btn-primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn:hover{border-color:#B99659}
.btn-primary:hover{background:var(--navy-deep)}

.empty-state{display:none;text-align:center;padding:80px 20px;color:var(--subtle)}
.empty-state.show{display:block}
.empty-state svg{margin-bottom:12px;opacity:.35}
.empty-state strong{display:block;color:var(--muted);font-size:15px;margin-bottom:4px}

.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,14px);z-index:200;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px);padding:10px 15px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:#0B2036;color:#fff;box-shadow:0 12px 34px rgba(11,32,54,.28);font-size:12px;font-weight:700;opacity:0;pointer-events:none;transition:.18s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast code{max-width:56vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#E1C58E;font:11px var(--mono);direction:ltr;unicode-bidi:isolate}

.modal-backdrop{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(11,32,54,.6);backdrop-filter:blur(4px)}
.modal-backdrop.show{display:flex}
.modal-box{width:100%;max-width:360px;padding:24px;border:1px solid var(--line);border-radius:15px;background:#fff;box-shadow:0 24px 80px rgba(0,0,0,.2);animation:modalIn .16s ease-out}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98)}}
.modal-box h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;color:var(--navy-deep);font-family:var(--serif);font-size:20px}
.modal-box h3 svg{width:16px;height:16px}
.modal-box p{margin:0 0 15px;color:var(--muted);font-size:12px;line-height:1.5}
.modal-box input{width:100%;height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:9px;background:#F8FAFC;color:var(--navy-deep);font:13px var(--mono);direction:ltr;text-align:left;outline:none}
.modal-box input:focus{border-color:#B88A43;box-shadow:0 0 0 3px rgba(184,138,67,.12)}
.modal-error{min-height:14px;margin-top:7px;color:var(--red);font-size:11px;font-weight:700}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-actions .btn{flex:1}
footer{max-width:1240px;margin:40px auto 0;padding:16px 24px 0;border-top:1px solid var(--line);color:#9AA8B5;text-align:center;font:10px var(--mono)}

@media (max-width:820px){
  .toolbar-note{display:none}
  .grid{grid-template-columns:1fr}
}
@media (max-width:620px){
  header{padding:18px 14px 20px}
  .eyebrow{align-items:flex-start;letter-spacing:.08em}
  .head-controls{width:100%;order:2}
  .ctrl-btn{flex:1;justify-content:center}
  .title-row{align-items:flex-start}
  h1{font-size:28px}
  .stat-pill{font-size:11px}
  .toolbar-inner{padding:10px 14px 0}
  #searchInput{height:42px;padding-right:42px;padding-left:42px}
  .search-kbd{display:none}
  .clear-search{left:8px}
  .bar-inner{padding:9px 14px 11px;scroll-snap-type:x proximity}
  .chip{scroll-snap-align:center}
  main{padding:15px 12px 0}
  .grid{gap:13px}
  .card{border-radius:14px}
  .card-top{padding:15px}
  .card-body{padding:13px 14px 15px}
  .airline-name{font-size:17px}
  .field{flex-direction:column;gap:3px}
  .field-label{flex:auto;width:100%;padding-top:0;font-size:10.5px}
  .field-note{padding-inline-start:0}
  .field-value{font-size:12px;padding-inline:4px}
  .copy-btn{width:34px;height:34px}
  .card-actions{justify-content:space-between}
  .action-hint{display:none}
}
@media (max-width:380px){
  .chip{font-size:11.5px}
  .card-head{gap:8px}
  .nofee-badge{display:none}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="eyebrow">
      <div class="eyebrow-left"><span class="line"></span>AMSALEM TOURS · חטיבת משרדי ממשלה</div>
      <div class="head-controls">
        <button class="ctrl-btn" id="showInactiveBtn" type="button" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>הצג לא פעילים</span>
        </button>
        <button class="ctrl-btn" id="resetBtn" type="button" title="איפוס כל השינויים (דורש סיסמה)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          <span>איפוס שינויים</span>
        </button>
      </div>
    </div>
    <div class="title-row">
      <h1>הסכמי קורפורייט <em>· חברות תעופה</em></h1>
      <div class="stat-pill">מציג <b id="count">0</b> מתוך <b id="total">0</b> הסכמים</div>
    </div>
  </div>
</header>

<nav class="airline-bar" id="airlineBar" aria-label="חיפוש ובחירת הסכם">
  <div class="toolbar-inner">
    <div class="search-shell">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
      <input id="searchInput" type="search" autocomplete="off" placeholder="חיפוש חברה, קוד, פקודה או יעד…" aria-label="חיפוש בהסכמים">
      <button class="clear-search" id="clearSearch" type="button" aria-label="ניקוי חיפוש">×</button>
      <span class="search-kbd">/</span>
    </div>
    <div class="toolbar-note">טיפ: לחיצה על פקודה מעתיקה אותה</div>
  </div>
  <div class="bar-inner" id="chips"></div>
</nav>

<main id="main">

};

/* h('div', {class:'x', text:'...', onclick:fn}, ...children) */
function h(tag, attrs = {}, ...kids){
  const el = document.createElement(tag);
  for(const [k, v] of Object.entries(attrs)){
    if(v == null || v === false) continue;
    if(k === 'class') el.className = v;
    else if(k === 'text') el.textContent = v;
    else if(k === 'html') el.innerHTML = v;
    else if(k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if(c != null && c !== false) el.append(c); });
  return el;
}

/* אלמנט שניתן לעריכה: שומר בכל הקלדה, Enter מסיים, הדבקה כטקסט נקי */
function editable(tag, cls, text, on, onCommit, placeholder){
  const el = h(tag, {class: cls, text});
  if(!on) return el;
  el.classList.add('is-editable');
  try{ el.contentEditable = 'plaintext-only'; }catch(e){ el.contentEditable = 'true'; }
  el.spellcheck = false;
  if(placeholder) el.dataset.ph = placeholder;
  el.addEventListener('input', () => onCommit(el.textContent.trim()));
  el.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); el.blur(); } });
  el.addEventListener('paste', e => {
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData('text/plain').replace(/\s*\n\s*/g, ' ');
    document.execCommand('insertText', false, t);
  });
  el.addEventListener('blur', () => { if(!el.textContent.trim()) el.textContent = ''; });
  return el;
}

/* לוגו שנכשל פעם אחת לא נטען שוב בכל רינדור */

function logo(code, cls){
  if(failedLogos.has(code)) return null;
  const img = h('img', {class: cls, src: logoUrl(code), alt: '', loading: 'lazy', decoding: 'async'});
  img.addEventListener('error', () => { failedLogos.add(code); img.classList.add('hidden'); }, {once: true});
  return img;
}

/* בועת לוגו — אם הלוגו לא נטען, מוצג קוד ה-IATA */
function bubble(code){
  const b = h('span', {class: 'bubble', title: code});
  if(failedLogos.has(code)){ b.textContent = code; return b; }
  const img = h('img', {src: logoUrl(code), alt: code, decoding: 'async'});
  img.addEventListener('error', () => { failedLogos.add(code); img.remove(); b.textContent = code; }, {once: true});
  b.append(img);
  return b;
}

const removeBtn = (onClick, title) =>

async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  // גיבוי לדפדפנים / הקשרים ללא Clipboard API
  const ta = h('textarea', {readonly: ''});
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
  document.body.append(ta);
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  ta.remove();
  return ok;
}

async function copyValue(text, btn){
  text = (text || '').trim();
  if(!text) return;
  if(!(await copyText(text))){ toast('ההעתקה נכשלה'); return; }
  toast('הועתק', text);
  if(btn){
    btn.innerHTML = ICON.check;
    btn.classList.add('copied');
    clearTimeout(btn._t);
    btn._t = setTimeout(() => { btn.innerHTML = ICON.copy; btn.classList.remove('copied'); }, 1300);
  }
}

let toastTimer;
function toast(msg, code){
  toastEl.replaceChildren(h('span', {text: msg}), code ? h('code', {text: code}) : null);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
}

    val.title = 'לחיצה להעתקה';
    val.addEventListener('click', () => copyValue(val.textContent, btn));
  }
  const row = h('div', {class: 'value-row'}, val, btn);
  if(onRemove) row.append(removeBtn(() => { row.remove(); onRemove(); }, 'הסרת שורה'));
  return {row, val};
}

function renderField(f, id, idx, editing){
  const label = editable('div', 'field-label', f.label, editing, v => patchField(id, idx, {label: v}), 'כותרת');
  const values = h('div', {class: 'values'});

  if(f.multi){
    let addBtn = null;
    const commit = () => patchField(id, idx, {
      multi: [...values.querySelectorAll('.field-value')].map(e => e.textContent.trim()).filter(Boolean)
    });
    const addRow = (text, focus) => {
      const {row, val} = valueRow(text, editing, commit, editing ? commit : null);
      values.insertBefore(row, addBtn);
      if(focus) val.focus();
    };
    f.multi.forEach(v => addRow(v));
    if(editing){
      addBtn = h('button', {type: 'button', class: 'add-btn', text: '+ הוספת שורה', onclick: () => addRow('', true)});
      values.append(addBtn);
    }
  } else {
    values.append(valueRow(f.value, editing, v => patchField(id, idx, {value: v})).row);
  }

  return h('div', {class: 'field-block'},
    h('div', {class: 'field' + (f.multi ? ' multi' : '')}, label, values),
    f.note && h('div', {class: 'field-note', text: f.note}));
}

function renderBenefits(item, editing){
  const ul = h('ul', {class: 'benefits'});
  const commit = () => patchCard(item.id, {
    benefits: [...ul.querySelectorAll('.benefit-text')].map(e => e.textContent.trim()).filter(Boolean)
  });
  const addItem = (text, focus) => {
    const span = editable('span', 'benefit-text', text, editing, commit, 'תיאור ההטבה');
    const li = h('li', {}, span);
    if(editing) li.append(removeBtn(() => { li.remove(); commit(); }, 'הסרת הטבה'));
    ul.append(li);
    if(focus) span.focus();
  };
  item.benefits.forEach(b => addItem(b));

  const out = [h('div', {class: 'section-label', text: 'הטבות הסכם'}), ul];
  if(editing) out.push(h('button', {type: 'button', class: 'add-btn', text: '+ הוספת הטבה', onclick: () => addItem('', true)}));
  return out;
}

function editBar(id){
  return h('div', {class: 'edit-bar'},
    h('span', {class: 'edit-hint', text: 'השינויים נשמרים אוטומטית בדפדפן הזה'}),
    h('button', {type: 'button', class: 'btn', text: 'שחזור מקור', title: 'החזרת הכרטיס לנתונים המקוריים', onclick: () => {
      if(!confirm('להחזיר את הכרטיס הזה לנתונים המקוריים?\n(סטטוס פעיל/לא פעיל יישמר)')) return;
      const active = overrides[id]?.active;
      delete overrides[id];
      if(active !== undefined) overrides[id] = {active};
      saveOverrides();
      render();
      toast('הכרטיס שוחזר');
    }}),
    h('button', {type: 'button', class: 'btn btn-primary', text: 'סיום עריכה', onclick: stopEditing}));
}

/* =====================================================================
   כרטיס
   ===================================================================== */
function renderCard(item){
  const id = item.id;
  const editing = editingId === id;

  const name = editable('h2', 'airline-name', item.name, editing, v => patchCard(id, {name: v}), 'שם ההסכם');
  const codes = h('div', {class: 'codes'},
    item.codes.map(c => h('span', {class: 'code-chip'}, logo(c, 'code-logo'), h('span', {text: c}))));

  const toggle = h('button', {
    type: 'button',
    class: 'active-toggle' + (item.active ? ' is-active' : ''),
    'aria-pressed': String(item.active),
    title: 'שינוי סטטוס ההסכם',
    onclick: () => requireAuth(() => {
      patchCard(id, {active: !item.active});
      render();
      toast(item.active ? 'ההסכם סומן כלא פעיל' : 'ההסכם סומן כפעיל');
    })
  }, h('span', {text: item.active ? 'פעיל' : 'לא פעיל'}), h('span', {class: 'switch'}));

  const editLabel = editing ? 'סיום עריכה' : 'עריכת הכרטיס';
  const editBtn = h('button', {
    type: 'button',
    class: 'edit-btn' + (editing ? ' on' : ''),
    title: editLabel, 'aria-label': editLabel,
    html: editing ? ICON.check : ICON.pencil,
    onclick: () => editing ? stopEditing() : requireAuth(() => startEditing(id))
  });

  const top = h('div', {class: 'card-top'},
    h('div', {class: 'card-head'},
      h('div', {class: 'card-title'}, name, codes),
      h('div', {class: 'card-top-right'},
        toggle,
        item.noFee && h('span', {class: 'nofee-badge', text: 'ללא עמלה'}),
        editBtn)));

  const copyAllBtn = h('button', {
    type: 'button', class: 'copy-all-btn',
    title: 'מעתיק את כל ערכי הפקודות, שורה לכל ערך',
    html: ICON.copy + '<span>העתק את כל הפקודות</span>'
  });
  copyAllBtn.addEventListener('click', async () => {
    const lines = item.fields.flatMap(f => f.multi ? f.multi : [f.value]).map(v => (v || '').trim()).filter(Boolean);
    if(!lines.length) return;
    if(await copyText(lines.join('\n'))){
      copyAllBtn.classList.add('copied');
      copyAllBtn.innerHTML = ICON.check + '<span>הכול הועתק</span>';
      toast('כל הפקודות הועתקו');
      setTimeout(() => { copyAllBtn.classList.remove('copied'); copyAllBtn.innerHTML = ICON.copy + '<span>העתק את כל הפקודות</span>'; }, 1400);
    } else toast('ההעתקה נכשלה');
  });

  const body = h('div', {class: 'card-body'},
    h('div', {class:'card-actions'}, copyAllBtn, h('span', {class:'action-hint', text:'או העתיקו פקודה בודדת בלחיצה'})),
    h('div', {class: 'fields'}, item.fields.map((f, idx) => renderField(f, id, idx, editing))));

  if(item.destinations?.length){
    body.append(
      h('div', {class: 'section-label', text: item.destLabel || 'יעדים'}),
      h('div', {class: 'dest-list'}, item.destinations.map(d => h('span', {class: 'dest-tag', text: d}))));
  }
  if(item.benefits.length || editing) body.append(...renderBenefits(item, editing));
  if(item.note || editing){
    body.append(editable('div', 'note' + (item.warn ? ' warn' : ''), item.note || '', editing,
      v => patchCard(id, {note: v}), 'הוספת הערה…'));
  }
  if(editing) body.append(editBar(id));

  return h('article', {
    class: 'card' + (item.active ? '' : ' inactive') + (editing ? ' editing' : ''),
    'data-id': id
  }, h('div', {class: 'stamp', text: 'לא בתוקף'}), top, h('div', {class: 'perf'}), body);
}

/* =====================================================================
   סרגל הלחצנים
   ===================================================================== */
function chipFor(item){
  const on = item.id === selectedId;
  const shown = item.codes.slice(0, MAX_BUBBLES);
  const extra = item.codes.length - shown.length;
  return h('button', {
    type: 'button',
    class: 'chip' + (on ? ' on' : '') + (item.active ? '' : ' inactive'),
    'aria-pressed': String(on),
    title: item.name + (item.active ? '' : ' (לא פעיל)'),
    'data-id': item.id,
    onclick: () => select(on ? null : item.id)
  },
    h('span', {class: 'bubbles'}, shown.map(c => bubble(c)), extra > 0 && h('span', {class: 'bubble bubble-more', text: '+' + extra})),
    h('span', {class: 'chip-label', text: item.short || item.name}));
}

function renderChips(visible){
  const allBtn = h('button', {
    type: 'button',
    class: 'chip chip-all' + (selectedId ? '' : ' on'),
    'aria-pressed': String(!selectedId),
    onclick: () => select(null)
  },
    h('span', {class: 'bubbles'}, h('span', {class: 'bubble bubble-all', html: ICON.grid})),
    h('span', {class: 'chip-label', text: 'הכל'}),
    h('span', {class: 'chip-count', text: visible.length}));
  chipsEl.replaceChildren(allBtn, ...visible.map(chipFor));
}

function select(id){
  selectedId = id;
  if(editingId && id && editingId !== id) editingId = null;
  syncHash();
  render();

  // אם גללנו למטה — חוזרים לראש הרשימה כדי לראות את הכרטיס שנבחר
  const top = mainEl.getBoundingClientRect().top + window.scrollY - barEl.offsetHeight - 10;
  if(window.scrollY > top) window.scrollTo({top});

  // במובייל — מרכזים את הלחצן שנבחר בסרגל הגלילה
  const chip = chipsEl.querySelector('.chip.on');
  if(chip && chipsEl.scrollWidth > chipsEl.clientWidth){
    chip.scrollIntoView({block: 'nearest', inline: 'center', behavior: 'smooth'});
  }
}

/* קישור ישיר להסכם דרך כתובת הדף (#agr-3) */
function idFromHash(){
  const id = decodeURIComponent(location.hash.slice(1));
  return BASE_DATA.some(b => b.id === id) ? id : null;
}
function syncHash(){
  try{ history.replaceState(null, '', selectedId ? '#' + selectedId : location.pathname + location.search); }catch(e){}
}
window.addEventListener('hashchange', () => { selectedId = idFromHash(); render(); });

/* =====================================================================
   חיפוש ורינדור ראשי
   ===================================================================== */
function norm(s){ return String(s || '').toLocaleLowerCase('he').replace(/\s+/g,' ').trim(); }
function itemMatches(item, q){
  if(!q) return true;
  const values = item.fields.flatMap(f => [f.label, f.value, ...(f.multi || []), f.note]);
  const haystack = [item.name, item.short, ...item.codes, ...(item.destinations || []), ...(item.benefits || []), item.note, ...values].join(' · ');
  return norm(haystack).includes(q);
}

function render(){
  const all = BASE_DATA.map(effectiveItem);
  const q = norm(searchQuery);
  const byStatus = all.filter(i => ui.showInactive || i.active);
  const visible = byStatus.filter(i => itemMatches(i, q));
  if(selectedId && !visible.some(i => i.id === selectedId)){ selectedId = null; syncHash(); }
  const shown = selectedId ? visible.filter(i => i.id === selectedId) : visible;

  renderChips(visible);
  grid.replaceChildren(...shown.map(renderCard));
  grid.classList.toggle('single', shown.length === 1);
  countEl.textContent = shown.length;
  totalEl.textContent = all.length;
  emptyEl.classList.toggle('show', shown.length === 0);
  if(shown.length === 0){
    emptyTitle.textContent = q ? 'לא נמצאה התאמה' : 'אין הסכמים להצגה';
    emptyText.textContent = q ? 'נסו שם חברה, קוד IATA, פקודת Amadeus או יעד אחר' : 'אפשר להציג שוב הסכמים לא פעילים';
  }
  clearSearch.classList.toggle('show', !!searchQuery);
}

/* =====================================================================
   עריכה + סיסמה
   ===================================================================== */
function startEditing(id){ editingId = id; render(); }
function stopEditing(){
  if(!editingId) return;
  editingId = null;
  render();
  toast('השינויים נשמרו');
}

function requireAuth(action){
  if(unlocked){ action(); return; }
  pendingAction = action;
  pwError.textContent = '';
  pwInput.value = '';
  pwModal.classList.add('show');
  setTimeout(() => pwInput.focus(), 30);
}
function closeModal(){
  pwModal.classList.remove('show');
  pendingAction = null;
}
function attemptUnlock(){
  if(pwInput.value === GATE_PASSWORD){
    unlocked = true;
    store.set(AUTH_KEY, 1, true);
    const action = pendingAction;
    closeModal();
    action?.();
  } else {
    pwError.textContent = 'סיסמה שגויה';
    pwInput.select();
  }
}
$('pwConfirm').addEventListener('click', attemptUnlock);
$('pwCancel').addEventListener('click', closeModal);
pwInput.addEventListener('keydown', e => { if(e.key === 'Enter') attemptUnlock(); });
pwModal.addEventListener('click', e => { if(e.target === pwModal) closeModal(); });

document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(pwModal.classList.contains('show')) closeModal();
  else if(editingId) stopEditing();
});

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value;
  selectedId = null;
  syncHash();
  render();
});
clearSearch.addEventListener('click', () => {
  searchQuery = '';
  searchInput.value = '';
  render();
  searchInput.focus();
});
document.addEventListener('keydown', e => {
  const tag = e.target?.tagName;
  const typing = tag === 'INPUT' || tag === 'TEXTAREA' || e.target?.isContentEditable;
  if(e.key === '/' && !typing){ e.preventDefault(); searchInput.focus(); }
  if(e.key === 'Escape' && document.activeElement === searchInput && searchInput.value){
    searchQuery = ''; searchInput.value = ''; render();
  }
});

/* =====================================================================
   כפתורי הכותרת
   ===================================================================== */
function syncInactiveBtn(){
  showInactiveBtn.classList.toggle('on', ui.showInactive);
  showInactiveBtn.setAttribute('aria-pressed', String(ui.showInactive));
}
showInactiveBtn.addEventListener('click', () => {
  ui.showInactive = !ui.showInactive;
  store.set(UI_KEY, ui);
  syncInactiveBtn();
  render();
});

resetBtn.addEventListener('click', () => requireAuth(() => {
  if(!confirm('לאפס את כל השינויים והסימונים שבוצעו ולחזור לברירת המחדל?')) return;
  overrides = {};
  saveOverrides();
  editingId = null;
  render();
  toast('כל השינויים אופסו');
}));

/* ===================================================================== */
syncInactiveBtn();
render();
</script>
</body>
</html>
