<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הסכמי קורפורייט ממשלה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Assistant:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6EE;
    --bg-soft:#F3ECDC;
    --card:#FFFFFF;
    --navy:#152944;
    --navy-deep:#0C1B2E;
    --navy-mid:#24405f;
    --gold:#B68D4C;
    --gold-light:#D9BD87;
    --gold-pale:#F0E3C8;
    --line:#E6DCC2;
    --text-hi:#182A3E;
    --text-mid:#5E6F80;
    --text-low:#9BA8B4;
    --red:#C4574A;
    --red-pale:#FBEAE4;
    --green:#3C7A5A;
    --radius:4px;
    --serif:'Frank Ruhl Libre', serif;
    --sans:'Assistant', sans-serif;
    --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 260px), var(--bg);
    color:var(--text-hi);
    font-family:var(--sans);
    min-height:100vh;
    padding-bottom:70px;
  }
  ::selection{background:var(--gold-light); color:var(--navy-deep);}
  button{font:inherit; color:inherit;}
  :focus-visible{outline:2px solid var(--gold); outline-offset:2px;}

  /* ===== header ===== */
  header{
    background:var(--navy-deep);
    background-image:
      radial-gradient(ellipse 700px 300px at 15% 0%, rgba(182,141,76,0.16), transparent 60%),
      linear-gradient(180deg, var(--navy-deep), var(--navy));
    padding:30px 24px 26px;
    position:relative;
    border-bottom:3px solid var(--gold);
  }
  header::after{
    content:''; position:absolute; bottom:-3px; left:0; right:0; height:3px;
    background:linear-gradient(90deg, transparent, var(--gold-light), var(--gold), var(--gold-light), transparent);
  }
  .head-inner{max-width:1180px; margin:0 auto;}
  .eyebrow{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.22em;
    color:var(--gold-light); text-transform:uppercase; margin-bottom:14px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:space-between;
  }
  .eyebrow-left{display:flex; align-items:center; gap:10px;}
  .eyebrow .line{height:1px; width:34px; background:var(--gold-light); opacity:.55;}
  .head-controls{display:flex; gap:8px; flex-wrap:wrap;}
  .title-row{display:flex; align-items:flex-end; justify-content:space-between; gap:12px 20px; flex-wrap:wrap;}
  h1{
    margin:0; font-family:var(--serif); font-weight:700;
    font-size:clamp(26px,4.4vw,38px); letter-spacing:.01em; color:#FBF7EE;
  }
  h1 em{color:var(--gold-light); font-style:normal; font-weight:400;}

  .stat-pill{
    font-family:var(--mono); font-size:11.5px; color:var(--gold-light);
    border:1px solid rgba(217,189,135,0.4); border-radius:20px; padding:8px 16px;
    white-space:nowrap; letter-spacing:.03em;
  }
  .stat-pill b{color:#FBF7EE; font-weight:700;}

  .ctrl-btn{
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.03em;
    border:1px solid rgba(217,189,135,0.4); background:transparent; color:var(--gold-light);
    padding:8px 14px; border-radius:20px; cursor:pointer; transition:background .15s, color .15s;
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .ctrl-btn:hover{background:rgba(217,189,135,0.12);}
  .ctrl-btn.on{background:var(--gold); color:var(--navy-deep); border-color:var(--gold);}
  .ctrl-btn svg{width:13px; height:13px;}

  /* ===== airline chip bar (sticky) ===== */
  .airline-bar{
    position:sticky; top:0; z-index:30;
    background:rgba(250,246,238,0.92);
    -webkit-backdrop-filter:blur(10px) saturate(1.2);
    backdrop-filter:blur(10px) saturate(1.2);
    border-bottom:1px solid var(--line);
    box-shadow:0 8px 20px -18px rgba(21,41,68,0.45);
  }
  .bar-inner{max-width:1180px; margin:0 auto; padding:14px 24px; display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    --ring:#fff;
    display:inline-flex; align-items:center; gap:8px; flex:none;
    padding-block:4px; padding-inline:5px 14px;
    background:#fff; border:1px solid var(--line); border-radius:999px;
    font-family:var(--sans); font-size:13px; font-weight:700; color:var(--navy);
    cursor:pointer; white-space:nowrap;
    transition:background .15s, border-color .15s, color .15s, box-shadow .15s, opacity .15s;
  }
  .chip.on{
    --ring:var(--navy);
    background:var(--navy); border-color:var(--navy); color:#FBF7EE;
    box-shadow:0 0 0 2px var(--gold-light);
  }
  .chip.inactive{opacity:.5; filter:grayscale(.8);}
  .chip.inactive .chip-label{text-decoration:line-through; text-decoration-color:var(--red);}
  .bubbles{display:flex; align-items:center;}
  .bubble{
    width:28px; height:28px; border-radius:50%; flex:none; position:relative;
    background:#fff; display:grid; place-items:center; overflow:hidden;
    box-shadow:0 0 0 2px var(--ring), 0 1px 3px rgba(21,41,68,0.2);
    font-family:var(--mono); font-size:9.5px; font-weight:800; color:var(--navy-deep); letter-spacing:-.02em;
  }
  .bubble + .bubble{margin-inline-start:-9px;}
  .bubble img{width:80%; height:80%; object-fit:contain; display:block;}
  .bubble-more{background:var(--gold-pale); font-size:10px;}
  .bubble-all{background:var(--navy); color:var(--gold-light);}
  .bubble-all svg{width:14px; height:14px;}
  .chip.on .bubble-all{background:var(--gold); color:var(--navy-deep);}
  .chip-count{
    font-family:var(--mono); font-size:10.5px; font-weight:700; padding:1px 7px; border-radius:10px;
    background:var(--bg-soft); color:var(--text-mid);
  }
  .chip.on .chip-count{background:rgba(255,255,255,0.14); color:var(--gold-light);}

  /* ===== layout ===== */
  main{max-width:1180px; margin:0 auto; padding:28px 24px 0;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(360px,1fr)); gap:22px;}
  .grid.single{grid-template-columns:minmax(0,620px); justify-content:center;}

  /* ===== boarding-pass card ===== */
  .card{
    background:var(--card); border-radius:var(--radius); border:1px solid var(--line);
    box-shadow:0 1px 2px rgba(21,41,68,0.06), 0 10px 30px -14px rgba(21,41,68,0.18);
    overflow:hidden; display:flex; flex-direction:column; position:relative;
    transition:box-shadow .2s, transform .2s, opacity .2s, filter .2s;
    animation:cardIn .2s ease-out;
  }
  @keyframes cardIn{from{opacity:0; transform:translateY(5px);}}
  .card.editing{box-shadow:0 0 0 2px var(--gold), 0 10px 30px -14px rgba(21,41,68,0.18);}
  .card.inactive{filter:grayscale(0.75); opacity:0.55;}

  .stamp{
    position:absolute; top:38%; left:50%; transform:translate(-50%,-50%) rotate(-16deg);
    font-family:var(--mono); font-weight:800; font-size:22px; letter-spacing:.12em;
    color:var(--red); border:3px solid var(--red); border-radius:6px;
    padding:6px 18px; background:rgba(251,234,228,0.9);
    pointer-events:none; z-index:5; white-space:nowrap;
    box-shadow:0 2px 10px rgba(196,87,74,0.25);
    display:none;
  }
  .card.inactive .stamp{display:block;}

  .card-top{background:linear-gradient(135deg, var(--navy), var(--navy-deep)); padding:18px 20px 16px;}
  .card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .card-title{min-width:0;}
  .airline-name{
    margin:0; font-family:var(--serif); font-size:16.5px; font-weight:700; color:#FBF7EE; line-height:1.35;
  }
  .codes{display:flex; gap:8px; flex-wrap:wrap; direction:ltr; justify-content:flex-start; margin-top:10px;}
  .code-chip{
    display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.03em;
    color:var(--navy-deep); background:var(--gold-light);
    padding:2px 9px 2px 2px; border-radius:20px;
  }
  .code-logo{width:18px; height:18px; border-radius:50%; background:#fff; object-fit:contain; padding:2px; flex:none; display:block;}
  .code-logo.hidden{display:none;}

  .card-top-right{display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex:none;}
  .nofee-badge{
    font-family:var(--mono); font-size:10px; font-weight:700; color:var(--navy-deep);
    background:var(--gold); padding:4px 10px; border-radius:20px; letter-spacing:.04em; white-space:nowrap;
  }
  .active-toggle{
    display:flex; align-items:center; gap:7px; cursor:pointer; user-select:none;
    background:none; border:0; padding:0;
    font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; color:var(--gold-light);
  }
  .switch{position:relative; width:32px; height:18px; border-radius:20px; background:var(--red); transition:background .15s; flex:none;}
  .switch::after{
    content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%;
    background:#FBF7EE; transition:transform .15s;
  }
  .active-toggle.is-active .switch{background:var(--green);}
  .active-toggle.is-active .switch::after{transform:translateX(14px);}

  .edit-btn{
    flex:none; width:26px; height:26px; border-radius:50%; border:1px solid rgba(217,189,135,0.4);
    background:transparent; color:var(--gold-light); cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:background .15s, color .15s;
  }
  .edit-btn.on{background:var(--gold); color:var(--navy-deep); border-color:var(--gold);}
  .edit-btn svg{width:12px; height:12px;}

  .perf{position:relative; height:0; border-top:2px dashed var(--gold-light);}
  .perf::before, .perf::after{
    content:''; position:absolute; top:-9px; width:18px; height:18px; border-radius:50%; background:var(--bg);
  }
  .perf::before{right:-9px;}
  .perf::after{left:-9px;}

  .card-body{padding:16px 20px 20px; display:flex; flex-direction:column; gap:12px; flex:1;}

  /* fields */
  .fields{display:flex; flex-direction:column;}
  .field-block{padding:8px 0; display:flex; flex-direction:column; gap:4px;}
  .field-block + .field-block{border-top:1px solid var(--line);}
  .field{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .field.multi{align-items:flex-start;}
  .field-label{font-size:11.5px; color:var(--text-mid); font-weight:700; flex:none; max-width:40%;}
  .values{display:flex; flex-direction:column; align-items:flex-end; gap:6px; min-width:0; flex:1;}
  .value-row{display:flex; align-items:center; gap:8px; justify-content:flex-end; min-width:0; max-width:100%;}
  .field-value{
    font-family:var(--mono); font-size:13px; color:var(--navy-deep); font-weight:500;
    direction:ltr; text-align:left; overflow-wrap:anywhere; min-width:0;
    padding:2px 5px; border-radius:2px; transition:background .12s;
  }
  .field-value:not(.is-editable){cursor:copy;}
  .field-note{font-size:11px; color:var(--text-mid); font-style:italic;}

  .copy-btn{
    flex:none; width:26px; height:26px; border-radius:50%; border:1px solid var(--line);
    background:var(--bg); color:var(--text-mid); cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .15s;
  }
  .copy-btn.copied{color:#FBF7EE; background:var(--gold); border-color:var(--gold);}
  .copy-btn svg{width:12px; height:12px;}

  .remove-line-btn{
    flex:none; width:22px; height:22px; border-radius:50%; border:1px solid var(--red);
    background:var(--red-pale); color:var(--red); cursor:pointer; font-size:14px; line-height:1;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .add-btn{
    align-self:flex-start; font-family:var(--mono); font-size:11px; font-weight:700; color:var(--gold);
    background:var(--gold-pale); border:1px dashed var(--gold); border-radius:20px; padding:5px 12px; cursor:pointer;
  }
  .values .add-btn{align-self:flex-end;}

  .section-label{
    font-size:10.5px; font-weight:800; color:var(--gold); text-transform:uppercase;
    letter-spacing:.1em; margin:2px 0 -3px;
  }
  .dest-list{display:flex; flex-wrap:wrap; gap:5px; direction:ltr; justify-content:flex-start;}
  .dest-tag{
    font-family:var(--mono); font-size:10.5px; font-weight:600; color:var(--navy-mid);
    background:var(--bg-soft); border:1px solid var(--line); padding:2px 8px; border-radius:2px;
  }

  .benefits{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px;}
  .benefits li{
    font-size:12.5px; color:var(--text-mid); line-height:1.55; padding-right:16px; position:relative;
    display:flex; align-items:flex-start; gap:8px;
  }
  .benefits li::before{content:'✦'; position:absolute; right:0; top:2px; font-size:10px; color:var(--gold);}
  .benefit-text{flex:1;}

  .note{
    font-size:12px; color:var(--navy-mid); background:var(--gold-pale);
    border-right:3px solid var(--gold); border-radius:2px; padding:9px 12px; line-height:1.55;
  }
  .note.warn{color:#7A2E22; background:var(--red-pale); border-right-color:var(--red);}

  /* editable state */
  .is-editable{
    outline:none; cursor:text; min-width:40px;
    background:var(--gold-pale); border-bottom:1px dashed var(--gold); border-radius:2px;
  }
  .is-editable:focus{box-shadow:0 0 0 2px var(--gold-light);}
  .airline-name.is-editable{background:rgba(217,189,135,0.12); border-bottom-color:var(--gold-light); padding:0 4px;}
  .field-value.is-editable{white-space:normal;}
  .note.is-editable{border:1px dashed var(--gold); border-right:3px solid var(--gold);}
  [data-ph]:empty::before{content:attr(data-ph); color:var(--text-low); font-style:italic;}
  .airline-name[data-ph]:empty::before{color:rgba(217,189,135,0.6);}

  .edit-bar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-top:2px; padding-top:12px; border-top:1px dashed var(--gold-light);
  }
  .edit-hint{flex:1; min-width:140px; font-size:11px; color:var(--text-mid);}
  .btn{
    padding:8px 14px; border-radius:3px; font-family:var(--sans); font-weight:700; font-size:12.5px;
    cursor:pointer; border:1px solid var(--line); background:var(--bg); color:var(--text-mid);
  }
  .btn-primary{background:var(--navy); color:#FBF7EE; border-color:var(--navy);}

  /* hover only on real pointers (no sticky hover on mobile) */
  @media (hover:hover){
    .card:not(.editing):not(.inactive):hover{box-shadow:0 4px 10px rgba(21,41,68,0.08), 0 20px 40px -16px rgba(21,41,68,0.28); transform:translateY(-2px);}
    .chip:not(.on):hover{border-color:var(--gold); box-shadow:0 2px 8px -4px rgba(21,41,68,0.25);}
    .edit-btn:hover{background:var(--gold); color:var(--navy-deep); border-color:var(--gold);}
    .copy-btn:not(.copied):hover{color:var(--navy-deep); border-color:var(--gold); background:var(--gold-pale);}
    .field-value:not(.is-editable):hover{background:var(--gold-pale);}
    .btn:hover{border-color:var(--gold);}
    .btn-primary:hover{background:var(--navy-deep);}
  }

  .empty-state{text-align:center; padding:70px 20px; color:var(--text-low); display:none;}
  .empty-state.show{display:block;}
  .empty-state svg{margin-bottom:14px; opacity:.35;}

  /* ===== toast ===== */
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translate(-50%, 16px); z-index:200;
    display:flex; align-items:center; gap:8px; max-width:calc(100vw - 32px);
    background:var(--navy-deep); color:#FBF7EE; border:1px solid rgba(217,189,135,0.35);
    padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600;
    box-shadow:0 12px 30px -10px rgba(12,27,46,0.55);
    opacity:0; pointer-events:none; transition:opacity .2s, transform .2s;
  }
  .toast.show{opacity:1; transform:translate(-50%, 0);}
  .toast code{
    font-family:var(--mono); font-size:12px; color:var(--gold-light); direction:ltr; unicode-bidi:isolate;
    max-width:55vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }

  /* ===== password modal ===== */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(12,27,46,0.62); backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-backdrop.show{display:flex;}
  .modal-box{
    background:var(--card); border-radius:6px; padding:26px 26px 22px; width:100%; max-width:340px;
    box-shadow:0 20px 60px -12px rgba(12,27,46,0.5); border:1px solid var(--line);
    animation:modalIn .15s ease-out;
  }
  @keyframes modalIn{from{opacity:0; transform:translateY(6px) scale(.98);}}
  .modal-box h3{
    margin:0 0 6px; font-family:var(--serif); font-size:18px; color:var(--navy-deep); font-weight:700;
    display:flex; align-items:center; gap:8px;
  }
  .modal-box h3 svg{width:15px; height:15px;}
  .modal-box p{margin:0 0 16px; font-size:12.5px; color:var(--text-mid); line-height:1.5;}
  .modal-box input{
    width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:3px; font-family:var(--mono);
    font-size:14px; color:var(--navy-deep); outline:none; background:var(--bg); direction:ltr; text-align:left;
  }
  .modal-box input:focus{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold-pale);}
  .modal-error{font-size:11.5px; color:var(--red); margin-top:8px; min-height:14px; font-weight:600;}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .modal-actions .btn{flex:1; padding:10px; font-size:13px;}

  footer{
    max-width:1180px; margin:44px auto 0; padding:18px 24px 0; border-top:1px solid var(--line);
    font-family:var(--mono); font-size:10.5px; color:var(--text-low); text-align:center; letter-spacing:.05em;
  }

  /* ===== responsive ===== */
  @media (max-width:720px){
    .bar-inner{
      flex-wrap:nowrap; overflow-x:auto; padding:10px 14px;
      scroll-snap-type:x proximity; scrollbar-width:none; overscroll-behavior-x:contain;
      -webkit-mask-image:linear-gradient(to left, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
      mask-image:linear-gradient(to left, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
    }
    .bar-inner::-webkit-scrollbar{display:none;}
    .chip{scroll-snap-align:center;}
  }
  @media (max-width:480px){
    .grid, .grid.single{grid-template-columns:1fr; gap:16px;}
    header{padding:20px 14px 18px;}
    .eyebrow{font-size:9.5px; letter-spacing:.16em;}
    main{padding:18px 14px 0;}
    .card-top{padding:15px 16px 13px;}
    .card-body{padding:14px 16px 16px; gap:10px;}
    .airline-name{font-size:15px;}
    .field-label{font-size:11px; max-width:44%;}
    .field-value{font-size:12px;}
    .stamp{font-size:16px; padding:4px 12px;}
  }
  @media (max-width:360px){
    .field{flex-wrap:wrap;}
    .values{align-items:flex-start; width:100%;}
    .value-row{justify-content:flex-start;}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto;}
    *, *::before, *::after{animation:none !important; transition:none !important;}
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="eyebrow">
      <div class="eyebrow-left"><span class="line"></span>AMSALEM TOURS · חטיבת משרדי ממשלה</div>
      <div class="head-controls">
        <button class="ctrl-btn" id="showInactiveBtn" type="button" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>הצג לא פעילים</span>
        </button>
        <button class="ctrl-btn" id="resetBtn" type="button" title="איפוס כל השינויים (דורש סיסמה)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          <span>איפוס שינויים</span>
        </button>
      </div>
    </div>
    <div class="title-row">
      <h1>הסכמי קורפורייט <em>· חברות תעופה</em></h1>
      <div class="stat-pill">מציג <b id="count">0</b> מתוך <b id="total">0</b> הסכמים</div>
    </div>
  </div>

};

/* h('div', {class:'x', text:'...', onclick:fn}, ...children) */
function h(tag, attrs = {}, ...kids){
  const el = document.createElement(tag);
  for(const [k, v] of Object.entries(attrs)){
    if(v == null || v === false) continue;
    if(k === 'class') el.className = v;
    else if(k === 'text') el.textContent = v;
    else if(k === 'html') el.innerHTML = v;
    else if(k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if(c != null && c !== false) el.append(c); });
  return el;
}

/* אלמנט שניתן לעריכה: שומר בכל הקלדה, Enter מסיים, הדבקה כטקסט נקי */
function editable(tag, cls, text, on, onCommit, placeholder){
  const el = h(tag, {class: cls, text});
  if(!on) return el;
  el.classList.add('is-editable');
  try{ el.contentEditable = 'plaintext-only'; }catch(e){ el.contentEditable = 'true'; }
  el.spellcheck = false;
  if(placeholder) el.dataset.ph = placeholder;
  el.addEventListener('input', () => onCommit(el.textContent.trim()));
  el.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); el.blur(); } });
  el.addEventListener('paste', e => {
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData('text/plain').replace(/\s*\n\s*/g, ' ');
    document.execCommand('insertText', false, t);
  });
  el.addEventListener('blur', () => { if(!el.textContent.trim()) el.textContent = ''; });
  return el;
}

function logo(code, cls){
  if(failedLogos.has(code)) return null;
  const img = h('img', {class: cls, src: logoUrl(code), alt: '', loading: 'lazy', decoding: 'async'});
  img.addEventListener('error', () => { failedLogos.add(code); img.classList.add('hidden'); }, {once: true});
  return img;
}

/* בועת לוגו — אם הלוגו לא נטען, מוצג קוד ה-IATA */
function bubble(code){
  const b = h('span', {class: 'bubble', title: code});
  if(failedLogos.has(code)){ b.textContent = code; return b; }
  const img = h('img', {src: logoUrl(code), alt: code, decoding: 'async'});
  img.addEventListener('error', () => { failedLogos.add(code); img.remove(); b.textContent = code; }, {once: true});
  b.append(img);
  return b;
}

/* =====================================================================
   העתקה + הודעות
   ===================================================================== */
async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  // גיבוי לדפדפנים / הקשרים ללא Clipboard API
  const ta = h('textarea', {readonly: ''});
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
  document.body.append(ta);
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  ta.remove();
  return ok;
}

async function copyValue(text, btn){
  text = (text || '').trim();
  if(!text) return;
  if(!(await copyText(text))){ toast('ההעתקה נכשלה'); return; }
  toast('הועתק', text);
  if(btn){
    btn.innerHTML = ICON.check;
    btn.classList.add('copied');
    clearTimeout(btn._t);
    btn._t = setTimeout(() => { btn.innerHTML = ICON.copy; btn.classList.remove('copied'); }, 1300);
  }
}

let toastTimer;
function toast(msg, code){
  toastEl.replaceChildren(h('span', {text: msg}), code ? h('code', {text: code}) : null);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
}

  if(!editing){
    val.title = 'לחיצה להעתקה';
    val.addEventListener('click', () => copyValue(val.textContent, btn));
  }
  const row = h('div', {class: 'value-row'}, val, btn);
  if(onRemove) row.append(removeBtn(() => { row.remove(); onRemove(); }, 'הסרת שורה'));
  return {row, val};
}

function renderField(f, id, idx, editing){
  const label = editable('div', 'field-label', f.label, editing, v => patchField(id, idx, {label: v}), 'כותרת');
  const values = h('div', {class: 'values'});

  if(f.multi){
    let addBtn = null;
    const commit = () => patchField(id, idx, {
      multi: [...values.querySelectorAll('.field-value')].map(e => e.textContent.trim()).filter(Boolean)
    });
    const addRow = (text, focus) => {
      const {row, val} = valueRow(text, editing, commit, editing ? commit : null);
      values.insertBefore(row, addBtn);
      if(focus) val.focus();
    };
    f.multi.forEach(v => addRow(v));
    if(editing){
      addBtn = h('button', {type: 'button', class: 'add-btn', text: '+ הוספת שורה', onclick: () => addRow('', true)});
      values.append(addBtn);
    }
  } else {
    values.append(valueRow(f.value, editing, v => patchField(id, idx, {value: v})).row);
  }

  return h('div', {class: 'field-block'},
    h('div', {class: 'field' + (f.multi ? ' multi' : '')}, label, values),
    f.note && h('div', {class: 'field-note', text: f.note}));
}

function renderBenefits(item, editing){
  const ul = h('ul', {class: 'benefits'});
  const commit = () => patchCard(item.id, {
    benefits: [...ul.querySelectorAll('.benefit-text')].map(e => e.textContent.trim()).filter(Boolean)
  });
  const addItem = (text, focus) => {
    const span = editable('span', 'benefit-text', text, editing, commit, 'תיאור ההטבה');
    const li = h('li', {}, span);
    if(editing) li.append(removeBtn(() => { li.remove(); commit(); }, 'הסרת הטבה'));
    ul.append(li);
    if(focus) span.focus();
  };
  item.benefits.forEach(b => addItem(b));

  const out = [h('div', {class: 'section-label', text: 'הטבות הסכם'}), ul];
  if(editing) out.push(h('button', {type: 'button', class: 'add-btn', text: '+ הוספת הטבה', onclick: () => addItem('', true)}));
  return out;
}

function editBar(id){
  return h('div', {class: 'edit-bar'},
    h('span', {class: 'edit-hint', text: 'השינויים נשמרים אוטומטית בדפדפן הזה'}),
    h('button', {type: 'button', class: 'btn', text: 'שחזור מקור', title: 'החזרת הכרטיס לנתונים המקוריים', onclick: () => {
      if(!confirm('להחזיר את הכרטיס הזה לנתונים המקוריים?\n(סטטוס פעיל/לא פעיל יישמר)')) return;
      const active = overrides[id]?.active;
      delete overrides[id];
      if(active !== undefined) overrides[id] = {active};
      saveOverrides();
      render();
      toast('הכרטיס שוחזר');
    }}),
    h('button', {type: 'button', class: 'btn btn-primary', text: 'סיום עריכה', onclick: stopEditing}));
}

/* =====================================================================
   כרטיס
   ===================================================================== */
function renderCard(item){
  const id = item.id;
  const editing = editingId === id;

  const name = editable('h2', 'airline-name', item.name, editing, v => patchCard(id, {name: v}), 'שם ההסכם');
  const codes = h('div', {class: 'codes'},
    item.codes.map(c => h('span', {class: 'code-chip'}, logo(c, 'code-logo'), h('span', {text: c}))));

  const toggle = h('button', {
    type: 'button',
    class: 'active-toggle' + (item.active ? ' is-active' : ''),
    'aria-pressed': String(item.active),
    title: 'שינוי סטטוס ההסכם',
    onclick: () => requireAuth(() => {
      patchCard(id, {active: !item.active});
      render();
      toast(item.active ? 'ההסכם סומן כלא פעיל' : 'ההסכם סומן כפעיל');
    })
  }, h('span', {text: item.active ? 'פעיל' : 'לא פעיל'}), h('span', {class: 'switch'}));

  const editLabel = editing ? 'סיום עריכה' : 'עריכת הכרטיס';
  const editBtn = h('button', {
    type: 'button',
    class: 'edit-btn' + (editing ? ' on' : ''),
    title: editLabel, 'aria-label': editLabel,
    html: editing ? ICON.check : ICON.pencil,
    onclick: () => editing ? stopEditing() : requireAuth(() => startEditing(id))
  });

  const top = h('div', {class: 'card-top'},
    h('div', {class: 'card-head'},
      h('div', {class: 'card-title'}, name, codes),
      h('div', {class: 'card-top-right'},
        toggle,
        item.noFee && h('span', {class: 'nofee-badge', text: 'ללא עמלה'}),
        editBtn)));

  const body = h('div', {class: 'card-body'},
    h('div', {class: 'fields'}, item.fields.map((f, idx) => renderField(f, id, idx, editing))));

  if(item.destinations?.length){
    body.append(
      h('div', {class: 'section-label', text: item.destLabel || 'יעדים'}),
      h('div', {class: 'dest-list'}, item.destinations.map(d => h('span', {class: 'dest-tag', text: d}))));
  }
  if(item.benefits.length || editing) body.append(...renderBenefits(item, editing));
  if(item.note || editing){
    body.append(editable('div', 'note' + (item.warn ? ' warn' : ''), item.note || '', editing,
      v => patchCard(id, {note: v}), 'הוספת הערה…'));
  }
  if(editing) body.append(editBar(id));

  return h('article', {
    class: 'card' + (item.active ? '' : ' inactive') + (editing ? ' editing' : ''),
    'data-id': id
  }, h('div', {class: 'stamp', text: 'לא בתוקף'}), top, h('div', {class: 'perf'}), body);
}

/* =====================================================================
   סרגל הלחצנים
   ===================================================================== */
function chipFor(item){
  const on = item.id === selectedId;
  const shown = item.codes.slice(0, MAX_BUBBLES);
  const extra = item.codes.length - shown.length;
  return h('button', {
    type: 'button',
    class: 'chip' + (on ? ' on' : '') + (item.active ? '' : ' inactive'),
    'aria-pressed': String(on),
    title: item.name + (item.active ? '' : ' (לא פעיל)'),
    'data-id': item.id,
    onclick: () => select(on ? null : item.id)
  },
    h('span', {class: 'bubbles'}, shown.map(c => bubble(c)), extra > 0 && h('span', {class: 'bubble bubble-more', text: '+' + extra})),
    h('span', {class: 'chip-label', text: item.short || item.name}));
}

function renderChips(visible){
  const allBtn = h('button', {
    type: 'button',
    class: 'chip chip-all' + (selectedId ? '' : ' on'),
    'aria-pressed': String(!selectedId),
    onclick: () => select(null)
  },
    h('span', {class: 'bubbles'}, h('span', {class: 'bubble bubble-all', html: ICON.grid})),
    h('span', {class: 'chip-label', text: 'הכל'}),
    h('span', {class: 'chip-count', text: visible.length}));
  chipsEl.replaceChildren(allBtn, ...visible.map(chipFor));
}

function select(id){
  selectedId = id;
  if(editingId && id && editingId !== id) editingId = null;
  syncHash();
  render();

  // אם גללנו למטה — חוזרים לראש הרשימה כדי לראות את הכרטיס שנבחר
  const top = mainEl.getBoundingClientRect().top + window.scrollY - barEl.offsetHeight - 10;
  if(window.scrollY > top) window.scrollTo({top});

  // במובייל — מרכזים את הלחצן שנבחר בסרגל הגלילה
  const chip = chipsEl.querySelector('.chip.on');
  if(chip && chipsEl.scrollWidth > chipsEl.clientWidth){
    chip.scrollIntoView({block: 'nearest', inline: 'center', behavior: 'smooth'});
  }
}

/* קישור ישיר להסכם דרך כתובת הדף (#agr-3) */
function idFromHash(){
  const id = decodeURIComponent(location.hash.slice(1));
  return BASE_DATA.some(b => b.id === id) ? id : null;
}
function syncHash(){
  try{ history.replaceState(null, '', selectedId ? '#' + selectedId : location.pathname + location.search); }catch(e){}
}
window.addEventListener('hashchange', () => { selectedId = idFromHash(); render(); });

/* =====================================================================
   רינדור ראשי
   ===================================================================== */
function render(){
  const all = BASE_DATA.map(effectiveItem);
  const visible = all.filter(i => ui.showInactive || i.active);
  if(selectedId && !visible.some(i => i.id === selectedId)){ selectedId = null; syncHash(); }
  const shown = selectedId ? visible.filter(i => i.id === selectedId) : visible;

  renderChips(visible);
  grid.replaceChildren(...shown.map(renderCard));
  grid.classList.toggle('single', shown.length === 1);
  countEl.textContent = shown.length;
  totalEl.textContent = all.length;
  emptyEl.classList.toggle('show', shown.length === 0);
}

/* =====================================================================
   עריכה + סיסמה
   ===================================================================== */
function startEditing(id){ editingId = id; render(); }
function stopEditing(){
  if(!editingId) return;
  editingId = null;
  render();
  toast('השינויים נשמרו');
}

function requireAuth(action){
  if(unlocked){ action(); return; }
  pendingAction = action;
  pwError.textContent = '';
  pwInput.value = '';
  pwModal.classList.add('show');
  setTimeout(() => pwInput.focus(), 30);
}
function closeModal(){
  pwModal.classList.remove('show');
  pendingAction = null;
}
function attemptUnlock(){
  if(pwInput.value === GATE_PASSWORD){
    unlocked = true;
    store.set(AUTH_KEY, 1, true);
    const action = pendingAction;
    closeModal();
    action?.();
  } else {
    pwError.textContent = 'סיסמה שגויה';
    pwInput.select();
  }
}
$('pwConfirm').addEventListener('click', attemptUnlock);
$('pwCancel').addEventListener('click', closeModal);
pwInput.addEventListener('keydown', e => { if(e.key === 'Enter') attemptUnlock(); });
pwModal.addEventListener('click', e => { if(e.target === pwModal) closeModal(); });

document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(pwModal.classList.contains('show')) closeModal();
  else if(editingId) stopEditing();
});

/* =====================================================================
   כפתורי הכותרת
   ===================================================================== */
function syncInactiveBtn(){
  showInactiveBtn.classList.toggle('on', ui.showInactive);
  showInactiveBtn.setAttribute('aria-pressed', String(ui.showInactive));
}
showInactiveBtn.addEventListener('click', () => {
  ui.showInactive = !ui.showInactive;
  store.set(UI_KEY, ui);
  syncInactiveBtn();
  render();
});

resetBtn.addEventListener('click', () => requireAuth(() => {
  if(!confirm('לאפס את כל השינויים והסימונים שבוצעו ולחזור לברירת המחדל?')) return;
  overrides = {};
  saveOverrides();
  editingId = null;
  render();
  toast('כל השינויים אופסו');
}));

/* ===================================================================== */
syncInactiveBtn();
render();
</script>
</body>
</html>
