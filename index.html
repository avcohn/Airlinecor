<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הסכמי קורפורייט ממשלה</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@400;500;700;900&family=Assistant:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6EE;
    --bg-soft:#F3ECDC;
    --card:#FFFFFF;
    --navy:#152944;
    --navy-deep:#0C1B2E;
    --navy-mid:#24405f;
    --gold:#B68D4C;
    --gold-light:#D9BD87;
    --gold-pale:#F0E3C8;
    --line:#E6DCC2;
    --text-hi:#182A3E;
    --text-mid:#5E6F80;
    --text-low:#9BA8B4;
    --red:#C4574A;
    --red-pale:#FBEAE4;
    --green:#3C7A5A;
    --radius:4px;
    --serif:'Frank Ruhl Libre', serif;
    --sans:'Assistant', sans-serif;
    --mono:'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:
      linear-gradient(180deg, var(--bg-soft) 0%, var(--bg) 260px),
      var(--bg);
    color:var(--text-hi);
    font-family:var(--sans);
    min-height:100vh;
    padding-bottom:70px;
  }
  ::selection{background:var(--gold-light); color:var(--navy-deep);}

  /* header */
  header{
    background:var(--navy-deep);
    background-image:
      radial-gradient(ellipse 700px 300px at 15% 0%, rgba(182,141,76,0.16), transparent 60%),
      linear-gradient(180deg, var(--navy-deep), var(--navy));
    padding:34px 24px 30px;
    position:relative;
    border-bottom:3px solid var(--gold);
  }
  header::after{
    content:'';
    position:absolute; bottom:-3px; left:0; right:0; height:3px;
    background:linear-gradient(90deg, transparent, var(--gold-light), var(--gold), var(--gold-light), transparent);
  }
  .head-inner{max-width:1180px; margin:0 auto;}
  .eyebrow{
    font-family:var(--mono); font-size:10.5px; letter-spacing:.22em;
    color:var(--gold-light); text-transform:uppercase; margin-bottom:12px;
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; justify-content:space-between;
  }
  .eyebrow-left{display:flex; align-items:center; gap:10px;}
  .eyebrow .line{height:1px; width:34px; background:var(--gold-light); opacity:.55;}
  h1{
    margin:0 0 20px; font-family:var(--serif); font-weight:700;
    font-size:clamp(26px,4.4vw,38px); letter-spacing:.01em; color:#FBF7EE;
  }
  h1 em{color:var(--gold-light); font-style:normal; font-weight:400;}

  .search-row{display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
  .search-wrap{position:relative; flex:1; min-width:220px;}
  .search-wrap svg{position:absolute; top:50%; right:16px; transform:translateY(-50%); color:var(--navy-mid); pointer-events:none;}
  #search{
    width:100%; background:#FBF7EE; border:1px solid transparent; border-radius:2px;
    padding:13px 44px 13px 16px; color:var(--navy-deep); font-family:var(--sans); font-size:15px;
    font-weight:600; outline:none; transition:box-shadow .15s;
  }
  #search:focus{box-shadow:0 0 0 2px var(--gold);}
  #search::placeholder{color:var(--text-low); font-weight:500;}

  .stat-pill{
    font-family:var(--mono); font-size:11.5px; color:var(--gold-light);
    border:1px solid rgba(217,189,135,0.4); border-radius:20px; padding:9px 16px;
    white-space:nowrap; letter-spacing:.03em;
  }
  .stat-pill b{color:#FBF7EE; font-weight:700;}

  /* top controls: edit mode + show inactive + reset */
  .ctrl-btn{
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.03em;
    border:1px solid rgba(217,189,135,0.4); background:transparent; color:var(--gold-light);
    padding:8px 14px; border-radius:20px; cursor:pointer; transition:all .15s;
    display:flex; align-items:center; gap:6px; white-space:nowrap;
  }
  .ctrl-btn:hover{background:rgba(217,189,135,0.12);}
  .ctrl-btn.on{background:var(--gold); color:var(--navy-deep); border-color:var(--gold);}
  .ctrl-btn svg{width:13px; height:13px;}

  /* main layout */
  main{max-width:1180px; margin:0 auto; padding:32px 24px 0;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(360px,1fr));
    gap:22px;
  }

  /* boarding pass card */
  .card{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:0 1px 2px rgba(21,41,68,0.06), 0 10px 30px -14px rgba(21,41,68,0.18);
    overflow:hidden;
    display:flex; flex-direction:column;
    transition:box-shadow .2s, transform .2s, opacity .2s, filter .2s;
    border:1px solid var(--line);
    position:relative;
  }
  .card:hover{ box-shadow:0 4px 10px rgba(21,41,68,0.08), 0 20px 40px -16px rgba(21,41,68,0.28); transform:translateY(-2px); }
  .card.editing{ box-shadow:0 0 0 2px var(--gold), 0 10px 30px -14px rgba(21,41,68,0.18); }

  .card.inactive{ filter:grayscale(0.75); opacity:0.55; }
  .card.inactive:hover{ transform:none; }

  .stamp{
    position:absolute; top:38%; left:50%; transform:translate(-50%,-50%) rotate(-16deg);
    font-family:var(--mono); font-weight:800; font-size:22px; letter-spacing:.12em;
    color:var(--red); border:3px solid var(--red); border-radius:6px;
    padding:6px 18px; background:rgba(251,234,228,0.9);
    text-transform:uppercase; pointer-events:none; z-index:5;
    box-shadow:0 2px 10px rgba(196,87,74,0.25);
    display:none;
    white-space:nowrap;
  }
  .card.inactive .stamp{display:block;}

  .card-top{
    background:linear-gradient(135deg, var(--navy), var(--navy-deep));
    padding:18px 20px 16px;
    position:relative;
  }
  .card-top::before{
    content:''; position:absolute; top:10px; left:14px;
    font-family:var(--mono); font-size:9px; letter-spacing:.15em; color:var(--gold-light); opacity:.5;
  }
  .card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .airline-name{
    font-family:var(--serif); font-size:16.5px; font-weight:700; color:#FBF7EE; line-height:1.35;
    outline:none;
  }
  .airline-name[contenteditable="true"]{
    border-bottom:1px dashed var(--gold-light); cursor:text;
  }
  .codes{display:flex; gap:8px; flex-wrap:wrap; direction:ltr; justify-content:flex-start; margin-top:10px;}
  .code-chip{
    display:flex; align-items:center; gap:6px;
    font-family:var(--mono); font-size:11px; font-weight:700; letter-spacing:.03em;
    color:var(--navy-deep); background:var(--gold-light);
    padding:2px 9px 2px 2px; border-radius:20px;
  }
  .code-logo{
    width:18px; height:18px; border-radius:50%; background:#fff; object-fit:contain;
    padding:2px; flex:none; display:block;
  }
  .code-logo.hidden{display:none;}

  .card-top-right{display:flex; flex-direction:column; align-items:flex-end; gap:8px; flex:none;}
  .nofee-badge{
    font-family:var(--mono); font-size:10px; font-weight:700; color:var(--navy-deep);
    background:var(--gold); padding:4px 10px; border-radius:20px; letter-spacing:.04em;
    flex:none; white-space:nowrap;
  }

  .active-toggle{
    display:flex; align-items:center; gap:7px; cursor:pointer; user-select:none;
    font-family:var(--mono); font-size:9.5px; letter-spacing:.05em; color:var(--gold-light);
  }
  .switch{
    position:relative; width:32px; height:18px; border-radius:20px;
    background:rgba(255,255,255,0.18); transition:background .15s; flex:none;
  }
  .switch::after{
    content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%;
    background:#FBF7EE; transition:transform .15s;
  }
  .active-toggle.is-active .switch{background:var(--green);}
  .active-toggle.is-active .switch::after{transform:translateX(14px);}
  .active-toggle:not(.is-active) .switch{background:var(--red);}

  .edit-btn{
    flex:none; width:26px; height:26px; border-radius:50%; border:1px solid rgba(217,189,135,0.4);
    background:transparent; color:var(--gold-light); cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .15s;
  }
  .edit-btn:hover, .edit-btn.on{ background:var(--gold); color:var(--navy-deep); border-color:var(--gold); }
  .edit-btn svg{width:12px; height:12px;}

  /* perforation divider */
  .perf{
    position:relative; height:0; border-top:2px dashed var(--gold-light);
    margin:0 0;
  }
  .perf::before, .perf::after{
    content:''; position:absolute; top:-9px; width:18px; height:18px; border-radius:50%;
    background:var(--bg);
  }
  .perf::before{ right:-9px; }
  .perf::after{ left:-9px; }

  .card-body{padding:18px 20px 20px; display:flex; flex-direction:column; gap:12px; flex:1;}

  .field{
    border-bottom:1px solid var(--line);
    padding:8px 0; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .field:last-of-type{border-bottom:none;}
  .field-label{font-size:11.5px; color:var(--text-mid); font-weight:700; flex:none; max-width:40%; outline:none;}
  .field-label[contenteditable="true"]{border-bottom:1px dashed var(--gold); cursor:text;}
  .field-value-wrap{display:flex; align-items:center; gap:8px; min-width:0; flex:1; justify-content:flex-end;}
  .field-value{
    font-family:var(--mono); font-size:13px; color:var(--navy-deep); direction:ltr; text-align:left;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500; outline:none;
  }
  .field-value[contenteditable="true"]{
    white-space:normal; border-bottom:1px dashed var(--gold); cursor:text; background:var(--gold-pale);
    padding:2px 6px; border-radius:2px;
  }
  .copy-btn{
    flex:none; width:26px; height:26px; border-radius:50%; border:1px solid var(--line);
    background:var(--bg); color:var(--text-mid); cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .15s;
  }
  .copy-btn:hover{color:var(--navy-deep); border-color:var(--gold); background:var(--gold-pale);}
  .copy-btn.copied{color:#FBF7EE; background:var(--gold); border-color:var(--gold);}
  .copy-btn svg{width:12px; height:12px;}

  .remove-line-btn{
    flex:none; width:22px; height:22px; border-radius:50%; border:1px solid var(--red);
    background:var(--red-pale); color:var(--red); cursor:pointer; font-size:14px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }

  .multi-field{align-items:flex-start;}
  .multi-field .field-value-wrap{flex-direction:column; align-items:flex-end; gap:6px;}
  .multi-row{display:flex; align-items:center; gap:8px;}

  .dest-list{display:flex; flex-wrap:wrap; gap:5px; direction:ltr; justify-content:flex-start;}
  .dest-tag{
    font-family:var(--mono); font-size:10.5px; font-weight:600; color:var(--navy-mid);
    background:var(--bg-soft); border:1px solid var(--line); padding:2px 8px; border-radius:2px;
  }

  .benefits{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px;}
  .benefits li{font-size:12.5px; color:var(--text-mid); line-height:1.55; padding-right:16px; position:relative; display:flex; align-items:flex-start; gap:8px;}
  .benefits li::before{
    content:'✦'; position:absolute; right:0; top:2px; font-size:10px; color:var(--gold);
  }
  .benefit-text{flex:1; outline:none;}
  .benefit-text[contenteditable="true"]{border-bottom:1px dashed var(--gold); cursor:text;}
  .add-benefit-btn{
    align-self:flex-start; font-family:var(--mono); font-size:11px; font-weight:700; color:var(--gold);
    background:var(--gold-pale); border:1px dashed var(--gold); border-radius:20px; padding:5px 12px;
    cursor:pointer; margin-top:2px;
  }

  .section-label{
    font-size:10.5px; font-weight:800; color:var(--gold); text-transform:uppercase;
    letter-spacing:.1em; font-family:var(--sans); margin:2px 0 -3px;
  }

  .note{
    font-size:12px; color:var(--navy-mid); background:var(--gold-pale);
    border-right:3px solid var(--gold); border-radius:2px; padding:9px 12px; line-height:1.55;
    outline:none;
  }
  .note[contenteditable="true"]{border:1px dashed var(--gold); border-right:3px solid var(--gold); cursor:text;}
  .note.warn{color:#7A2E22; background:#FBEAE4; border-right-color:var(--red);}
  .field-note{
    font-size:11px; color:var(--text-mid); font-style:italic; margin-top:-6px;
  }

  .empty-state{text-align:center; padding:70px 20px; color:var(--text-low); display:none;}
  .empty-state.show{display:block;}
  .empty-state svg{margin-bottom:14px; opacity:.35;}

  /* password modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(12,27,46,0.62); backdrop-filter:blur(2px);
    display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
  }
  .modal-backdrop.show{display:flex;}
  .modal-box{
    background:var(--card); border-radius:6px; padding:26px 26px 22px; width:100%; max-width:340px;
    box-shadow:0 20px 60px -12px rgba(12,27,46,0.5); border:1px solid var(--line);
    animation:modalIn .15s ease-out;
  }
  @keyframes modalIn{ from{opacity:0; transform:translateY(6px) scale(.98);} to{opacity:1; transform:none;} }
  .modal-box h3{
    margin:0 0 6px; font-family:var(--serif); font-size:18px; color:var(--navy-deep); font-weight:700;
    display:flex; align-items:center; gap:8px;
  }
  .modal-box p{margin:0 0 16px; font-size:12.5px; color:var(--text-mid); line-height:1.5;}
  .modal-box input{
    width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:3px; font-family:var(--mono);
    font-size:14px; color:var(--navy-deep); outline:none; background:var(--bg); direction:ltr; text-align:left;
  }
  .modal-box input:focus{border-color:var(--gold); box-shadow:0 0 0 2px var(--gold-pale);}
  .modal-error{
    font-size:11.5px; color:var(--red); margin-top:8px; min-height:14px; font-weight:600;
  }
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .modal-actions button{
    flex:1; padding:10px; border-radius:3px; font-family:var(--sans); font-weight:700; font-size:13px;
    cursor:pointer; border:1px solid var(--line); background:var(--bg); color:var(--text-mid);
  }
  .modal-actions button.primary{background:var(--navy); color:#FBF7EE; border-color:var(--navy);}
  .modal-actions button.primary:hover{background:var(--navy-deep);}
  .lock-pill{
    display:flex; align-items:center; gap:5px;
  }
  .lock-pill svg{width:11px; height:11px;}

  footer{
    max-width:1180px; margin:44px auto 0; padding:18px 24px 0; border-top:1px solid var(--line);
    font-family:var(--mono); font-size:10.5px; color:var(--text-low); text-align:center; letter-spacing:.05em;
  }

  @media (max-width:480px){
    .grid{grid-template-columns:1fr; gap:16px;}
    header{padding:22px 14px 20px;}
    h1{margin-bottom:16px;}
    .eyebrow{font-size:9.5px; letter-spacing:.16em;}
    main{padding:20px 14px 0;}
    .card-top{padding:15px 16px 13px;}
    .card-body{padding:15px 16px 16px; gap:10px;}
    .airline-name{font-size:15px;}
    .field-label{font-size:11px; max-width:44%;}
    .field-value{font-size:12px;}
    .search-row{flex-direction:column; align-items:stretch;}
    .stat-pill{text-align:center;}
    #search{padding:12px 40px 12px 14px; font-size:16px;}
    .stamp{font-size:16px; padding:4px 12px;}
  }
  @media (max-width:360px){
    .field{flex-wrap:wrap;}
    .field-value-wrap{justify-content:flex-start; width:100%;}
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="eyebrow">
      <div class="eyebrow-left"><span class="line"></span>AMSALEM TOURS · חטיבת משרדי ממשלה</div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button class="ctrl-btn" id="editModeBtn" type="button">
          <svg id="editModeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
          <span id="editModeLabel">מצב עריכה</span>
        </button>
        <button class="ctrl-btn" id="showInactiveBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>הצג לא פעילים</span>
        </button>
        <button class="ctrl-btn" id="resetBtn" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
          איפוס שינויים
        </button>
      </div>
    </div>
    <h1>הסכמי קורפורייט <em>· חברות תעופה</em></h1>
    <div class="search-row">
      <div class="search-wrap">
        <input id="search" type="text" placeholder="חיפוש לפי חברת תעופה, קוד IATA, תמחור..." autocomplete="off" name="corp-agreements-search-nofill">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      </div>
      <div class="stat-pill">מציג <b id="count">0</b> הסכמים</div>
    </div>
  </div>
</header>

<main>
  <div class="grid" id="grid"></div>
  <div class="empty-state" id="empty">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <div>לא נמצאו הסכמים תואמים</div>
  </div>
</main>

<footer>מסמך פנימי · Amsalem Tours</footer>

<div class="modal-backdrop" id="pwModal">
  <div class="modal-box">
    <h3><span class="lock-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span> נדרשת סיסמה</h3>
    <p>פעולה זו (עריכת נתונים / שינוי סטטוס פעיל) דורשת סיסמת הרשאה.</p>
    <input type="password" id="pwInput" placeholder="סיסמה" autocomplete="off">
    <div class="modal-error" id="pwError"></div>
    <div class="modal-actions">
      <button type="button" id="pwCancel">ביטול</button>
      <button type="button" id="pwConfirm" class="primary">אישור</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = 'corp_agreements_overrides_v1';

const BASE_DATA = [
  {
    name: "אל על — במערכת הישראלית",
    codes: ["LY"],
    fields: [
      {label:"הערת קורפורייט", value:"SRCODP-12686"},
      {label:"פקודת תמחור", value:"fxr/r,u*igo00"},
      {label:"אמצעי תשלום", value:"fpagt*v123456%com12686"},
    ],
    destinations: ["TLV","LON","ZRH","ROM","NYC","PAR","BER","WAS","GVA","DXB","FRA","USA","Europe"],
    destLabel: "יעדי יציאה בהסכם",
    benefits: [
      "מחויבות על אישור מקום ב-Y עד 48 שעות לפני הטיסה (כל עוד הטיסה עד 5 מקומות ו/או אין עליה עוצרת מחויבות — יש להכניס קורפורייט להזמנה ולפנות למוקד אל על לאישור)",
      "שינוי שם עד הכרטוס ללא עלות (יש לפנות למוקד אל על)",
      "שינוי וביטול כרטיסי קלאסיק ללא עלות, הבדלים במחיר בלבד (מופיע בתנאי כרטיס)",
      "במידה ואין תמחור עם IGO00, יש לתמחר קור05, לא צריך אישור מיוחד",
      "במידה ואין גם קור05, יש לפנות למוקד לקבלת תמחור ידני — בטיסות ישירות בלבד",
    ],
    noFee: true
  },
  {
    name: "אל על — במערכת האמריקאית",
    codes: ["LY"],

/* ---------- persistence ---------- */
function loadOverrides(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : {};
  }catch(e){ return {}; }
}
function saveOverrides(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(overrides)); }catch(e){}
}
let overrides = loadOverrides();

function getOverride(id){
  if(!overrides[id]) overrides[id] = {};
  return overrides[id];
}
function patchOverride(id, patch){
  const o = getOverride(id);
  Object.assign(o, patch);
  saveOverrides();
}

/* merge base item with its override into an effective render item (deep-ish clone) */
function effectiveItem(base){
  const o = overrides[base.id] || {};
  const item = JSON.parse(JSON.stringify(base));
  item.active = o.active !== undefined ? o.active : true;
  if(o.name !== undefined) item.name = o.name;
  if(o.note !== undefined) item.note = o.note;
  if(o.benefits !== undefined) item.benefits = o.benefits;
  if(o.fields){
    item.fields.forEach((f, idx)=>{
      const fo = o.fields[idx];
      if(!fo) return;
      if(fo.label !== undefined) f.label = fo.label;
      if(f.multi){
        if(fo.multi !== undefined) f.multi = fo.multi;
      } else {
        if(fo.value !== undefined) f.value = fo.value;
      }
    });
  }
  return item;
}

function requireAuth(action){
  if(unlocked){ action(); return; }
  pendingAction = action;
  pwError.textContent = '';
  pwInput.value = '';
  pwModal.classList.add('show');
  setTimeout(()=> pwInput.focus(), 30);
}
function closeModal(){
  pwModal.classList.remove('show');
  pendingAction = null;
}
function attemptUnlock(){
  if(pwInput.value === GATE_PASSWORD){
    unlocked = true;
    sessionStorage.setItem('corp_unlocked','1');
    const action = pendingAction;
    closeModal();
    if(action) action();
  } else {
    pwError.textContent = 'סיסמה שגויה';
    pwInput.value = '';
    pwInput.focus();
  }
}
pwConfirm.addEventListener('click', attemptUnlock);
pwCancel.addEventListener('click', closeModal);
pwInput.addEventListener('keydown', (e)=>{
  if(e.key==='Enter') attemptUnlock();
  if(e.key==='Escape') closeModal();
});

function checkSvg(){

/* ---------- field builders (now id-aware + editable) ---------- */
function makeCopyBtn(getText){
  const btn = document.createElement('button');
  btn.className='copy-btn';
  btn.innerHTML = copySvg();
  btn.type='button';
  btn.setAttribute('aria-label','העתק');
  btn.addEventListener('click', (e)=>{
    e.stopPropagation();
    navigator.clipboard.writeText(getText()).then(()=>{
      btn.innerHTML = checkSvg();
      btn.classList.add('copied');
      setTimeout(()=>{ btn.innerHTML = copySvg(); btn.classList.remove('copied'); }, 1300);
    });
  });
  return btn;
}

function commitFieldValue(id, fieldIdx, value){
  const o = getOverride(id);
  if(!o.fields) o.fields = {};
  if(!o.fields[fieldIdx]) o.fields[fieldIdx] = {};
  o.fields[fieldIdx].value = value;
  saveOverrides();
}
function commitFieldLabel(id, fieldIdx, label){
  const o = getOverride(id);
  if(!o.fields) o.fields = {};
  if(!o.fields[fieldIdx]) o.fields[fieldIdx] = {};
  o.fields[fieldIdx].label = label;
  saveOverrides();
}
function commitFieldMulti(id, fieldIdx, arr){
  const o = getOverride(id);
  if(!o.fields) o.fields = {};
  if(!o.fields[fieldIdx]) o.fields[fieldIdx] = {};
  o.fields[fieldIdx].multi = arr;
  saveOverrides();
}

function makeField(f, id, fieldIdx){
  const outer = document.createElement('div');
  outer.style.display='flex'; outer.style.flexDirection='column'; outer.style.gap='4px';

  const wrap = document.createElement('div');
  wrap.className = 'field' + (f.multi ? ' multi-field' : '');

  const label = document.createElement('div');
  label.className = 'field-label';
  label.textContent = f.label;
  label.contentEditable = editMode ? 'true' : 'false';
  label.addEventListener('blur', ()=> commitFieldLabel(id, fieldIdx, label.textContent.trim()));
  wrap.appendChild(label);

  const valWrap = document.createElement('div');
  valWrap.className = 'field-value-wrap';

  if(f.multi){
    const rows = [];
    function rebuildMulti(){
      const arr = rows.filter(r=>r.el.isConnected).map(r=> r.val.textContent.trim());
      commitFieldMulti(id, fieldIdx, arr);
    }
    f.multi.forEach(v=>{
      const row = document.createElement('div');
      row.className = 'multi-row';
      const val = document.createElement('div');
      val.className='field-value'; val.textContent=v;
      val.contentEditable = editMode ? 'true' : 'false';
      val.addEventListener('blur', rebuildMulti);
      const btn = makeCopyBtn(()=>val.textContent);
      row.appendChild(val);
      row.appendChild(btn);
      if(editMode){
        const rm = document.createElement('button');
        rm.type='button'; rm.className='remove-line-btn'; rm.textContent='×';
        rm.title='הסר שורה';
        rm.addEventListener('click', ()=>{ row.remove(); rebuildMulti(); });
        row.appendChild(rm);
      }
      rows.push({el:row, val});
      valWrap.appendChild(row);
    });
    if(editMode){
      const addBtn = document.createElement('button');
      addBtn.type='button'; addBtn.className='add-benefit-btn'; addBtn.textContent='+ הוסף שורה';
      addBtn.addEventListener('click', ()=>{
        const row = document.createElement('div');
        row.className='multi-row';
        const val = document.createElement('div');
        val.className='field-value'; val.textContent='';
        val.contentEditable='true';
        val.addEventListener('blur', rebuildMulti);
        const btn = makeCopyBtn(()=>val.textContent);
        const rm = document.createElement('button');
        rm.type='button'; rm.className='remove-line-btn'; rm.textContent='×';
        rm.addEventListener('click', ()=>{ row.remove(); rebuildMulti(); });
        row.appendChild(val); row.appendChild(btn); row.appendChild(rm);
        rows.push({el:row, val});
        valWrap.insertBefore(row, addBtn);
        val.focus();
      });
      valWrap.appendChild(addBtn);
    }
  } else {
    const val = document.createElement('div');
    val.className = 'field-value';
    val.textContent = f.value;
    val.title = f.value;
    val.contentEditable = editMode ? 'true' : 'false';
    val.addEventListener('blur', ()=> commitFieldValue(id, fieldIdx, val.textContent.trim()));
    const btn = makeCopyBtn(()=>val.textContent);
    valWrap.appendChild(val);
    valWrap.appendChild(btn);
  }

  wrap.appendChild(valWrap);
  outer.appendChild(wrap);

  if(f.note){
    const noteEl = document.createElement('div');
    noteEl.className='field-note';
    noteEl.textContent = f.note;
    outer.appendChild(noteEl);
  }

  return outer;
}

      const val = n.textContent.trim();
      patchOverride(id, {note: val});
      if(!val && editMode){ n.dataset.placeholder='1'; n.style.opacity='0.5'; n.textContent='(הוסף הערה)'; }
    });
    body.appendChild(n);
  }

  card.appendChild(body);
  return card;
}

/* ---------- search / filter ---------- */
function normalize(s){ return (s||'').toLowerCase(); }

function matches(item, q){
  if(!q) return true;
  q = normalize(q);
  const haystack = [
    item.name,
    ...(item.codes||[]),
    ...(item.fields||[]).flatMap(f=> f.multi ? [f.label, ...f.multi] : [f.label, f.value]),
    ...(item.benefits||[]),
    item.note||'',
    ...(item.destinations||[])
  ].join(' ');
  return normalize(haystack).includes(q);
}

function render(){
  const q = search.value.trim();
  grid.innerHTML = '';
  const list = BASE_DATA
    .map(effectiveItem)
    .filter(item=> showInactive || item.active)
    .filter(item=> matches(item, q));

  list.forEach(item=>{
    const base = BASE_DATA.find(b=>b.id===item.id);
    grid.appendChild(renderCard(base));
  });
  countEl.textContent = list.length;
  emptyEl.classList.toggle('show', list.length===0);
}

/* ---------- top controls ---------- */
function syncEditModeBtn(){
  editModeBtn.classList.toggle('on', editMode);
  editModeLabel.textContent = editMode ? 'סיום עריכה' : 'מצב עריכה';
}
editModeBtn.addEventListener('click', ()=>{
  if(editMode){
    editMode = false;
    syncEditModeBtn();
    render();
  } else {
    requireAuth(()=>{
      editMode = true;
      syncEditModeBtn();
      render();
    });
  }
});

showInactiveBtn.classList.add('on');
showInactiveBtn.addEventListener('click', ()=>{
  showInactive = !showInactive;
  showInactiveBtn.classList.toggle('on', showInactive);
  render();
});

resetBtn.addEventListener('click', ()=>{
  if(confirm('לאפס את כל השינויים והסימונים שבוצעו ולחזור לברירת המחדל?')){
    overrides = {};
    saveOverrides();
    render();
  }
});

search.addEventListener('input', render);
syncEditModeBtn();
render();
</script>
</body>
</html>
