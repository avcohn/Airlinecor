<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   צבעים — מצב רך (ברירת מחדל)
   ===================================================================== */
:root{
  color-scheme:light;
  --bg:#E2E6EA;
  --card:#F3F4F1;
  --field:#E8EBEA;
  --field-line:#D9DFE2;
  --field-hover:#DCE3E8;
  --line:#CFD6DC;
  --line-strong:#B9C3CC;
  --text:#1C2B3A;
  --text-2:#384858;
  --muted:#5A6978;
  --subtle:#8794A1;
  --code:#13283D;
  --accent:#1F3D5B;
  --accent-ink:#FFFFFF;
  --accent-hover:#15304A;
  --gold:#A9824A;
  --gold-ink:#7E5D2B;
  --gold-pale:#EEE6D6;
  --green:#3A7855;
  --green-soft:#D7E9DD;
  --red:#A84A40;
  --hero-1:#10233A;
  --hero-2:#1D3B58;
  --top-1:#1F3C59;
  --top-2:#152B42;
  --bar-bg:rgba(226,230,234,.86);
  --chip:#EEF0ED;
  --note-bg:#ECE4D3;
  --note-line:#D8C6A2;
  --note-text:#47433A;
  --warn-bg:#F0DED9;
  --warn-line:#DFB9B2;
  --warn-text:#77342E;
  --edit-bg:#F4EBD9;
  --toast:#10233A;
  --k-price:#8E6A2C;  --k-price-bg:#E8DDC6;
  --k-pay:#357050;    --k-pay-bg:#D3E6D9;
  --k-code:#3A6690;   --k-code-bg:#D6E2EE;
  --k-remark:#585D92; --k-remark-bg:#DDDEEE;
  --k-other:#5A6978;  --k-other-bg:#DFE4E8;
  --shadow:0 1px 2px rgba(16,36,56,.05),0 8px 22px rgba(16,36,56,.07);
  --shadow-hover:0 2px 4px rgba(16,36,56,.06),0 14px 34px rgba(16,36,56,.11);
  --wm:#1F3D5B;
  --wm-op:.11;
  --wm-fill:var(--bg);
  --radius:16px;
  --sans:'IBM Plex Sans Hebrew','Assistant','Segoe UI',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}

/* מצב כהה — לפי הגדרת המערכת, אלא אם נבחר אחרת */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131A22; --card:#1A242F; --field:#202C38; --field-line:#2A3744; --field-hover:#283644;
    --line:#2A3643; --line-strong:#3A4858;
    --text:#DCE3EA; --text-2:#C1CBD5; --muted:#97A6B5; --subtle:#6D7E8F; --code:#EAF0F5;
    --accent:#C9A66C; --accent-ink:#141F2A; --accent-hover:#D6B784;
    --gold:#C9A66C; --gold-ink:#D6B783; --gold-pale:#2A2A24;
    --green:#5DAE80; --green-soft:#1C3127; --red:#DC7B6F;
    --hero-1:#0B131C; --hero-2:#172A3D; --top-1:#21374D; --top-2:#1A2C3F;
    --bar-bg:rgba(19,26,34,.86); --chip:#1D2832;
    --note-bg:#25251F; --note-line:#463E2D; --note-text:#D3CAB7;
    --warn-bg:#2E1E1D; --warn-line:#56302B; --warn-text:#EDB2A9;
    --edit-bg:#2D2A20; --toast:#2B3A4A;
    --k-price:#D9B77C;  --k-price-bg:#363024;
    --k-pay:#7CC69C;    --k-pay-bg:#1D3328;
    --k-code:#8FB6DB;   --k-code-bg:#1E3045;
    --k-remark:#A9B0E0; --k-remark-bg:#252A44;
    --k-other:#A3B1BF;  --k-other-bg:#26323E;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.22);
    --shadow-hover:0 2px 4px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.32);
    --wm:#9DB3C8; --wm-op:.07;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131A22; --card:#1A242F; --field:#202C38; --field-line:#2A3744; --field-hover:#283644;
  --line:#2A3643; --line-strong:#3A4858;
  --text:#DCE3EA; --text-2:#C1CBD5; --muted:#97A6B5; --subtle:#6D7E8F; --code:#EAF0F5;
  --accent:#C9A66C; --accent-ink:#141F2A; --accent-hover:#D6B784;
  --gold:#C9A66C; --gold-ink:#D6B783; --gold-pale:#2A2A24;
  --green:#5DAE80; --green-soft:#1C3127; --red:#DC7B6F;
  --hero-1:#0B131C; --hero-2:#172A3D; --top-1:#21374D; --top-2:#1A2C3F;
  --bar-bg:rgba(19,26,34,.86); --chip:#1D2832;
  --note-bg:#25251F; --note-line:#463E2D; --note-text:#D3CAB7;
  --warn-bg:#2E1E1D; --warn-line:#56302B; --warn-text:#EDB2A9;
  --edit-bg:#2D2A20; --toast:#2B3A4A;
  --k-price:#D9B77C;  --k-price-bg:#363024;
  --k-pay:#7CC69C;    --k-pay-bg:#1D3328;
  --k-code:#8FB6DB;   --k-code-bg:#1E3045;
  --k-remark:#A9B0E0; --k-remark-bg:#252A44;
  --k-other:#A3B1BF;  --k-other-bg:#26323E;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.22);
  --shadow-hover:0 2px 4px rgba(0,0,0,.3),0 14px 34px rgba(0,0,0,.32);
  --wm:#9DB3C8; --wm-op:.07;
}

/* =====================================================================
   בסיס
   ===================================================================== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;min-height:100vh;padding-bottom:56px;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;position:relative;isolation:isolate;transition:background-color .2s ease,color .2s ease}
header,main,footer{position:relative;z-index:1}
::selection{background:#E3CFA7;color:#10233A}
button,input{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* סימן מים — שדה תעופה ומטוסים */
.watermark{position:fixed;left:0;right:0;bottom:0;z-index:0;width:100%;height:min(43.75vw,70vh);color:var(--wm);opacity:var(--wm-op);pointer-events:none;transition:opacity .2s ease}

/* =====================================================================
   כותרת עליונה
   ===================================================================== */
header{overflow:hidden;padding:22px 24px 24px;background:linear-gradient(135deg,var(--hero-1) 0%,var(--hero-2) 100%);color:#fff}
header::before{content:'';position:absolute;inset:auto auto -170px -110px;width:460px;height:460px;border-radius:50%;background:radial-gradient(circle,rgba(201,166,108,.18),transparent 66%);pointer-events:none}
header::after{content:'';position:absolute;inset:auto 0 0 0;height:1px;background:linear-gradient(90deg,transparent,rgba(217,187,127,.5),transparent)}
.head-inner{position:relative;max-width:1240px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-between;gap:16px 28px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.mark{flex:none;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid rgba(217,187,127,.35);color:#DCC08A}
.mark svg{width:24px;height:24px}
.eyebrow{margin-bottom:3px;color:#C9B184;font-size:11.5px;font-weight:500;letter-spacing:.09em}
h1{margin:0;font-size:clamp(22px,2.9vw,30px);font-weight:600;line-height:1.2}
h1 em{font-style:normal;font-weight:300;color:#DCC08A;white-space:nowrap}
.head-side{display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.stat-pill{display:inline-flex;align-items:center;gap:5px;padding:5px 12px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(255,255,255,.06);color:#C9D4DE;font-size:12.5px}
.stat-pill b{font:600 12.5px var(--mono);color:#fff}
.head-controls{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.ctrl-btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:34px;padding:6px 12px;border:1px solid rgba(255,255,255,.15);border-radius:10px;background:rgba(255,255,255,.05);color:#E2D2B2;font-size:12.5px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s}
.ctrl-btn svg{width:15px;height:15px;flex:none}
.ctrl-btn:hover{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.26)}

/* =====================================================================
   סרגל בחירת הסכם
   ===================================================================== */
.airline-bar{position:sticky;top:0;z-index:30;background:var(--bar-bg);-webkit-backdrop-filter:blur(14px) saturate(1.15);backdrop-filter:blur(14px) saturate(1.15);border-bottom:1px solid var(--line)}
.bar-inner{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;gap:7px}
.chip{--ring:var(--chip);display:inline-flex;align-items:center;gap:8px;flex:none;min-height:36px;padding-block:3px;padding-inline:3px 13px;background:var(--chip);border:1px solid var(--line);border-radius:999px;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--gold)}
.chip.on{--ring:var(--accent);background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.chip.inactive{opacity:.55}
.chip.inactive .chip-label{text-decoration:line-through;text-decoration-color:var(--red)}
.bubbles{display:flex;align-items:center;direction:ltr}
.bubble{width:28px;height:28px;border-radius:50%;flex:none;background:#fff;display:grid;place-items:center;overflow:hidden;box-shadow:0 0 0 2px var(--ring);font:600 9px var(--mono);color:#10233A}
.bubble+.bubble{margin-left:-8px}
.bubble img{width:78%;height:78%;object-fit:contain;display:block}
.bubble-more{background:#EADFC8}
.bubble-all{background:var(--field);color:var(--text)}
.bubble-all svg{width:14px;height:14px}
.chip.on .bubble-all{background:var(--accent-ink);color:var(--accent)}
.chip-count{padding:0 7px;border-radius:999px;background:var(--field);color:var(--muted);font:600 11px/18px var(--mono)}
.chip.on .chip-count{background:transparent;box-shadow:inset 0 0 0 1px currentColor;color:inherit;opacity:.85}
/* הסכמים שלא בתוקף — מקובצים בסוף השורה */
.chip-sep{flex:none;align-self:center;width:1px;height:22px;margin-inline:4px;background:var(--line-strong)}
.chip-archive{background:transparent;border-style:dashed;color:var(--muted)}
.chip-archive .bubble-all{box-shadow:none}
.chip-archive.open{background:var(--field);border-style:solid;color:var(--text)}
.chev{display:grid;place-items:center;margin-inline-start:-2px;transition:transform .18s ease}
.chev svg{width:14px;height:14px}
.chip-archive.open .chev{transform:rotate(180deg)}
.grid-divider{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:13px;font-weight:600}
.grid-divider svg{width:16px;height:16px}
.grid-divider::after{content:'';flex:1;height:1px;background:var(--line-strong)}

/* =====================================================================
   פריסה
   ===================================================================== */
main{max-width:1240px;margin:0 auto;padding:22px 24px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,430px),1fr));gap:18px;align-items:start}
.grid.single{grid-template-columns:minmax(0,780px);justify-content:center}

/* =====================================================================
   כרטיס הסכם
   ===================================================================== */
.card{position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);transition:box-shadow .18s ease,opacity .18s ease,border-color .18s ease}
.card:not(.inactive):hover{box-shadow:var(--shadow-hover)}
.card.editing{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,166,108,.22),var(--shadow)}
.card.inactive{opacity:.62;filter:saturate(.3)}

.card-top{padding:16px 18px 14px;background:linear-gradient(140deg,var(--top-1),var(--top-2));border-bottom:1px solid rgba(201,166,108,.45);color:#fff}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.card-title{flex:1;min-width:0}
.airline-name{margin:0;font-size:18px;font-weight:600;line-height:1.35;color:#fff}
.card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px}
.code-chip{direction:ltr;display:inline-flex;align-items:center;gap:6px;padding:2px 9px 2px 3px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.12);font:600 11px var(--mono);color:#F0DDB6}
.code-logo{width:20px;height:20px;border-radius:50%;background:#fff;object-fit:contain;padding:2px;display:block}
.code-logo.hidden{display:none}
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;line-height:20px}
.badge-gold{background:#D9BB7F;color:#13263A}
.badge-red{background:rgba(220,123,111,.18);border:1px solid rgba(220,123,111,.5);color:#FFC9C0}
.card-tools{display:flex;align-items:center;gap:7px;flex:none}
.active-toggle{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 10px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(255,255,255,.05);color:#DCE5EE;font-size:12px;font-weight:500;cursor:pointer;transition:background .15s}
.active-toggle:hover{background:rgba(255,255,255,.1)}
.switch{position:relative;width:30px;height:17px;border-radius:999px;background:#9A4A44;transition:background .16s}
.switch::after{content:'';position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .16s}
.active-toggle.is-active .switch{background:#3F8A61}
.active-toggle.is-active .switch::after{transform:translateX(13px)}
.edit-btn{width:30px;height:30px;border:1px solid rgba(255,255,255,.14);border-radius:9px;background:rgba(255,255,255,.05);color:#E2D2B2;display:grid;place-items:center;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.edit-btn svg{width:13px;height:13px}
.edit-btn:hover,.edit-btn.on{background:#D9BB7F;border-color:#D9BB7F;color:#13263A}

.card-body{display:flex;flex-direction:column;gap:14px;flex:1;padding:16px 18px 18px}
.card-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.copy-all-btn{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 12px;border:1px solid var(--line-strong);border-radius:10px;background:transparent;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.copy-all-btn svg{width:15px;height:15px}
.copy-all-btn .n{padding:0 7px;border-radius:999px;background:var(--field);color:var(--muted);font:600 11px/18px var(--mono)}
.copy-all-btn:hover{border-color:var(--gold);background:var(--gold-pale)}
.copy-all-btn.copied{background:var(--green-soft);border-color:var(--green);color:var(--green)}
.action-hint{color:var(--subtle);font-size:12px}

/* שדות הפקודות */
.fields{display:flex;flex-direction:column;background:var(--field);border:1px solid var(--field-line);border-radius:12px;overflow:hidden}
.field-block{display:flex;flex-direction:column;gap:4px;padding:10px 12px}
.field-block+.field-block{border-top:1px solid var(--field-line)}
.field{display:flex;align-items:flex-start;gap:12px}
.field-label{flex:0 0 34%;display:flex;align-items:flex-start;gap:9px;min-width:0;padding-top:4px;color:var(--muted);font-size:12.5px;font-weight:500;line-height:1.4}
.label-text{flex:1;min-width:0;padding-top:1px}
.kind{flex:none;width:24px;height:24px;margin-top:-2px;border-radius:7px;display:grid;place-items:center}
.kind svg{width:13px;height:13px}
.kind-price{background:var(--k-price-bg);color:var(--k-price)}
.kind-pay{background:var(--k-pay-bg);color:var(--k-pay)}
.kind-code{background:var(--k-code-bg);color:var(--k-code)}
.kind-remark{background:var(--k-remark-bg);color:var(--k-remark)}
.kind-other{background:var(--k-other-bg);color:var(--k-other)}
.values{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:5px}
.value-row{display:flex;align-items:center;gap:6px;min-width:0}
.field-value{flex:1;min-width:0;padding:5px 8px;border-radius:8px;color:var(--code);font:500 13.5px/1.45 var(--mono);direction:ltr;text-align:left;overflow-wrap:anywhere;transition:background .14s}
.field-value:not(.is-editable){cursor:copy}
.field-value:not(.is-editable):hover{background:var(--field-hover)}
.copy-btn{flex:none;width:32px;height:32px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--muted);display:grid;place-items:center;cursor:pointer;transition:background .14s,border-color .14s,color .14s}
.copy-btn svg{width:14px;height:14px}
.copy-btn:hover{border-color:var(--gold);background:var(--gold-pale);color:var(--text)}
.copy-btn.copied{background:var(--green);border-color:var(--green);color:#fff}
.field-note{padding-inline-start:33px;color:var(--gold-ink);font-size:12px;line-height:1.45}

/* יעדים, הטבות, הערות */
.section-label{display:flex;align-items:center;gap:10px;color:var(--gold-ink);font-size:12.5px;font-weight:600}
.section-label::after{content:'';flex:1;height:1px;background:var(--line)}
.dest-list{display:flex;flex-wrap:wrap;gap:6px}
.dest-tag{direction:ltr;padding:2px 9px;border:1px solid var(--line);border-radius:7px;background:var(--field);color:var(--muted);font:500 11.5px/20px var(--mono)}
.benefits{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.benefits li{position:relative;display:flex;align-items:flex-start;gap:8px;padding-inline-start:24px;color:var(--text-2);font-size:13.5px;line-height:1.6}
.benefits li::before{content:'✓';position:absolute;inset-inline-start:0;top:3px;width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:var(--green-soft);color:var(--green);font-size:9.5px;font-weight:700;line-height:1}
.benefit-text{flex:1}
.note{padding:10px 13px;border:1px solid var(--note-line);border-inline-start:3px solid var(--gold);border-radius:10px;background:var(--note-bg);color:var(--note-text);font-size:13px;line-height:1.6}
.note.warn{border-color:var(--warn-line);border-inline-start-color:var(--red);background:var(--warn-bg);color:var(--warn-text)}

/* מצב עריכה */
.is-editable{outline:none;min-width:40px;background:var(--edit-bg);border-bottom:1px dashed var(--gold);border-radius:4px;cursor:text}
.is-editable:focus{box-shadow:0 0 0 3px rgba(201,166,108,.2)}
.airline-name.is-editable{padding:2px 4px;background:rgba(255,247,233,.1);border-bottom-color:#E4C889}
[data-ph]:empty::before{content:attr(data-ph);color:var(--subtle);font-style:italic}
.airline-name[data-ph]:empty::before{color:#D8C6A6}
.remove-line-btn{flex:none;width:26px;height:26px;padding:0;border:1px solid var(--warn-line);border-radius:7px;background:var(--warn-bg);color:var(--red);display:grid;place-items:center;font-size:15px;cursor:pointer}
.add-btn{align-self:flex-start;padding:5px 10px;border:1px dashed var(--gold);border-radius:8px;background:var(--gold-pale);color:var(--gold-ink);font-size:12px;font-weight:600;cursor:pointer}
.values .add-btn{align-self:flex-end}
.edit-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:2px;padding-top:12px;border-top:1px dashed var(--note-line)}
.edit-hint{flex:1;min-width:150px;color:var(--muted);font-size:12px}
.btn{min-height:36px;padding:7px 14px;border:1px solid var(--line-strong);border-radius:9px;background:var(--card);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--gold)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}

/* מצב ריק */
.empty-state{display:none;padding:80px 20px;text-align:center;color:var(--subtle)}
.empty-state.show{display:block}
.empty-state svg{width:40px;height:40px;margin-bottom:12px;opacity:.45}
.empty-state strong{display:block;margin-bottom:4px;color:var(--muted);font-size:16px;font-weight:600}

/* הודעה קופצת */
.toast{position:fixed;bottom:22px;left:50%;z-index:200;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 32px);padding:10px 15px;border:1px solid rgba(255,255,255,.12);border-radius:11px;background:var(--toast);color:#fff;box-shadow:0 12px 34px rgba(8,20,32,.28);font-size:13px;font-weight:500;opacity:0;pointer-events:none;transform:translate(-50%,14px);transition:opacity .18s ease,transform .18s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast code{max-width:56vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#E1C58E;font:12px var(--mono);direction:ltr;unicode-bidi:isolate}

/* חלון סיסמה */
.modal-backdrop{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(8,20,32,.6);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.modal-backdrop.show{display:flex}
.modal-box{width:100%;max-width:360px;padding:24px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 24px 80px rgba(0,0,0,.25);animation:modalIn .16s ease-out}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98)}}
.modal-box h3{display:flex;align-items:center;gap:8px;margin:0 0 6px;color:var(--text);font-size:19px;font-weight:600}
.modal-box h3 svg{width:17px;height:17px;color:var(--gold)}
.modal-box p{margin:0 0 15px;color:var(--muted);font-size:13px;line-height:1.55}
.modal-box input{width:100%;height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:10px;background:var(--field);color:var(--text);font:14px var(--mono);direction:ltr;text-align:left;outline:none}
.modal-box input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,166,108,.18)}
.modal-error{min-height:16px;margin-top:7px;color:var(--red);font-size:12px;font-weight:600}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-actions .btn{flex:1}

footer{max-width:1240px;margin:40px auto 0;padding:16px 24px 0;border-top:1px solid var(--line);color:var(--subtle);font-size:12px;text-align:center}

const store = {
  get(key, fallback, session){
    try{
      const raw = (session ? sessionStorage : localStorage).getItem(key);
      return raw != null ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  },
  set(key, val, session){
    try{ (session ? sessionStorage : localStorage).setItem(key, JSON.stringify(val)); }catch(e){}
  }
};

let overrides = store.get(STORAGE_KEY, {});
if(!overrides || typeof overrides !== 'object') overrides = {};
const saveOverrides = () => store.set(STORAGE_KEY, overrides);
const cardOv = id => (overrides[id] ||= {});

function patchCard(id, patch){
  Object.assign(cardOv(id), patch);
  saveOverrides();
}
function patchField(id, idx, patch){
  const o = cardOv(id);
  o.fields ||= {};
  Object.assign(o.fields[idx] ||= {}, patch);
  saveOverrides();
}

/* מיזוג הנתונים המקוריים עם העריכות */
function effectiveItem(base){
  const o = overrides[base.id] || {};
  const item = JSON.parse(JSON.stringify(base));
  item.active = o.active !== undefined ? o.active : true;
  if(o.name !== undefined) item.name = o.name;
  if(o.note !== undefined) item.note = o.note;
  if(o.benefits !== undefined) item.benefits = o.benefits;
  if(o.fields){
    item.fields.forEach((f, idx) => {
      const fo = o.fields[idx];
      if(!fo) return;
      if(fo.label !== undefined) f.label = fo.label;
      if(f.multi){ if(fo.multi !== undefined) f.multi = fo.multi; }
      else if(fo.value !== undefined) f.value = fo.value;
    });
  }
  item.benefits ||= [];
  return item;
}

/* =====================================================================

   ===================================================================== */
/* h('div', {class:'x', text:'...', onclick:fn}, ...children) */
function h(tag, attrs = {}, ...kids){
  const el = document.createElement(tag);
  for(const [k, v] of Object.entries(attrs)){
    if(v == null || v === false) continue;
    if(k === 'class') el.className = v;
    else if(k === 'text') el.textContent = v;
    else if(k === 'html') el.innerHTML = v;
    else if(k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  kids.flat().forEach(c => { if(c != null && c !== false) el.append(c); });
  return el;
}

/* אלמנט שניתן לעריכה: שומר בכל הקלדה, Enter מסיים, הדבקה כטקסט נקי */
function editable(tag, cls, text, on, onCommit, placeholder){
  const el = h(tag, {class: cls, text});
  if(!on) return el;
  el.classList.add('is-editable');
  try{ el.contentEditable = 'plaintext-only'; }catch(e){ el.contentEditable = 'true'; }
  el.spellcheck = false;
  if(placeholder) el.dataset.ph = placeholder;
  el.addEventListener('input', () => onCommit(el.textContent.trim()));
  el.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); el.blur(); } });
  el.addEventListener('paste', e => {
    e.preventDefault();
    const t = (e.clipboardData || window.clipboardData).getData('text/plain').replace(/\s*\n\s*/g, ' ');
    document.execCommand('insertText', false, t);
  });
  el.addEventListener('blur', () => { if(!el.textContent.trim()) el.textContent = ''; });
  return el;
}

/* לוגו שנכשל פעם אחת לא נטען שוב בכל רינדור */
const failedLogos = new Set();

function logo(code, cls){
  if(failedLogos.has(code)) return null;
  const img = h('img', {class: cls, src: logoUrl(code), alt: '', loading: 'lazy', decoding: 'async'});
  img.addEventListener('error', () => { failedLogos.add(code); img.classList.add('hidden'); }, {once: true});
  return img;
}

/* בועת לוגו — אם הלוגו לא נטען, מוצג קוד ה-IATA */
function bubble(code){
  const b = h('span', {class: 'bubble', title: code});
  if(failedLogos.has(code)){ b.textContent = code; return b; }
  const img = h('img', {src: logoUrl(code), alt: code, decoding: 'async'});
  img.addEventListener('error', () => { failedLogos.add(code); img.remove(); b.textContent = code; }, {once: true});
  b.append(img);
  return b;
}

/* =====================================================================
   העתקה + הודעות
   ===================================================================== */
async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  // גיבוי לדפדפנים / הקשרים ללא Clipboard API
  const ta = h('textarea', {readonly: ''});
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
  document.body.append(ta);
  ta.select();
  let ok = false;
  try{ ok = document.execCommand('copy'); }catch(e){}
  ta.remove();
  return ok;
}

async function copyValue(text, btn){
  text = (text || '').trim();
  if(!text) return;
  if(!(await copyText(text))){ toast('ההעתקה נכשלה'); return; }
  toast('הועתק', text);
  if(btn){
    btn.innerHTML = ICON.check;
    btn.classList.add('copied');
    clearTimeout(btn._t);
    btn._t = setTimeout(() => { btn.innerHTML = ICON.copy; btn.classList.remove('copied'); }, 1300);
  }
}

let toastTimer;
function toast(msg, code){
  toastEl.replaceChildren(h('span', {text: msg}), code ? h('code', {text: code}) : null);
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
}

function valueRow(text, editing, onCommit, onRemove){

  btn.addEventListener('click', () => copyValue(val.textContent, btn));
  if(!editing){
    val.title = 'לחיצה להעתקה';
    val.addEventListener('click', () => copyValue(val.textContent, btn));
  }
  const row = h('div', {class: 'value-row'}, val, btn);
  if(onRemove) row.append(removeBtn(() => { row.remove(); onRemove(); }, 'הסרת שורה'));
  return {row, val};

function renderField(f, id, idx, editing){
  const kind = labelKind(f.label);
  const label = h('div', {class: 'field-label'},
    h('span', {class: 'kind kind-' + kind, html: KIND_ICON[kind]}),
    editable('span', 'label-text', f.label, editing, v => patchField(id, idx, {label: v}), 'כותרת'));
  const values = h('div', {class: 'values'});

  if(f.multi){
    let addBtn = null;
    const commit = () => patchField(id, idx, {
      multi: [...values.querySelectorAll('.field-value')].map(e => e.textContent.trim()).filter(Boolean)
    });
    const addRow = (text, focus) => {
      const {row, val} = valueRow(text, editing, commit, editing ? commit : null);
      values.insertBefore(row, addBtn);
      if(focus) val.focus();
    };
    f.multi.forEach(v => addRow(v));
    if(editing){
      addBtn = h('button', {type: 'button', class: 'add-btn', text: '+ הוספת שורה', onclick: () => addRow('', true)});
      values.append(addBtn);
    }
  } else {
    values.append(valueRow(f.value, editing, v => patchField(id, idx, {value: v})).row);
  }

  return h('div', {class: 'field-block'},
    h('div', {class: 'field' + (f.multi ? ' multi' : '')}, label, values),
    f.note && h('div', {class: 'field-note', text: f.note}));

      h('div', {class: 'card-title'}, name, meta),

  return h('article', {
    class: 'card' + (item.active ? '' : ' inactive') + (editing ? ' editing' : ''),

  const kids = [allBtn, ...active.map(chipFor)];

  // הסכמים שלא בתוקף — כפתור מקובץ בסוף השורה, נפתח לפי דרישה
  if(inactive.length){
    kids.push(
      h('span', {class: 'chip-sep', 'aria-hidden': 'true'}),
      h('button', {
        type: 'button',
        class: 'chip chip-archive' + (open ? ' open' : ''),
        'aria-expanded': String(open),
        title: open ? 'הסתרת ההסכמים שלא בתוקף' : 'הצגת ההסכמים שלא בתוקף',
        onclick: toggleArchive
      },
        h('span', {class: 'bubbles'}, h('span', {class: 'bubble bubble-all', html: ICON.archive})),
        h('span', {class: 'chip-label', text: 'לא בתוקף'}),
        h('span', {class: 'chip-count', text: inactive.length}),
        h('span', {class: 'chev', html: ICON.chevron})));
    if(open) kids.push(...inactive.map(chipFor));
  }
  chipsEl.replaceChildren(...kids);
}

function toggleArchive(){
  archiveOpen = !archiveOpen;
  // סגירה בזמן שמוצג הסכם לא בתוקף — חוזרים לכל ההסכמים
  if(!archiveOpen && selectedId){
    const base = BASE_DATA.find(b => b.id === selectedId);
    if(base && !effectiveItem(base).active){ selectedId = null; syncHash(); }
  }
  render();
  const btn = chipsEl.querySelector('.chip-archive');
  if(archiveOpen && btn && chipsEl.scrollWidth > chipsEl.clientWidth){
    btn.scrollIntoView({block: 'nearest', inline: 'start', behavior: 'smooth'});
  }
}

function select(id){
  selectedId = id;
  if(editingId && id && editingId !== id) editingId = null;
  syncHash();
  render();

  // אם גללנו למטה — חוזרים לראש הרשימה כדי לראות את הכרטיס שנבחר
  const top = mainEl.getBoundingClientRect().top + window.scrollY - barEl.offsetHeight - 10;
  if(window.scrollY > top) window.scrollTo({top});

  // כשהסרגל נגלל (מובייל/טאבלט) — מרכזים את הלחצן שנבחר
  const chip = chipsEl.querySelector('.chip.on');
  if(chip && chipsEl.scrollWidth > chipsEl.clientWidth){
    chip.scrollIntoView({block: 'nearest', inline: 'center', behavior: 'smooth'});
  }
}

/* גלגלת העכבר גוללת את הסרגל לרוחב כשהוא לא נכנס במסך */
chipsEl.addEventListener('wheel', e => {
  if(chipsEl.scrollWidth <= chipsEl.clientWidth + 1) return;
  if(Math.abs(e.deltaX) >= Math.abs(e.deltaY)) return;
  e.preventDefault();
  chipsEl.scrollBy({left: -e.deltaY});
}, {passive: false});

/* קישור ישיר להסכם דרך כתובת הדף (#agr-3) */
function idFromHash(){
  const id = decodeURIComponent(location.hash.slice(1));
  return BASE_DATA.some(b => b.id === id) ? id : null;
}
function syncHash(){
  try{ history.replaceState(null, '', selectedId ? '#' + selectedId : location.pathname + location.search); }catch(e){}
}
window.addEventListener('hashchange', () => { selectedId = idFromHash(); render(); });

/* =====================================================================
   רינדור ראשי
   ===================================================================== */
function render(){
  const all = BASE_DATA.map(effectiveItem);
  const active = all.filter(i => i.active);
  const inactive = all.filter(i => !i.active);
  const sel = selectedId ? all.find(i => i.id === selectedId) : null;
  if(selectedId && !sel){ selectedId = null; syncHash(); }
  const open = archiveOpen || !!(sel && !sel.active); // קישור ישיר להסכם לא בתוקף פותח את הקבוצה

  renderChips(active, inactive, open);

  let cards = [];
  if(sel){
    cards = [renderCard(sel)];
  } else {
    cards = active.map(renderCard);
    if(open && inactive.length){
      cards.push(h('div', {class: 'grid-divider'},
        h('span', {html: ICON.archive}), h('span', {text: 'לא בתוקף · ' + inactive.length})));
      cards.push(...inactive.map(renderCard));
    }
  }
  const cardCount = sel ? 1 : active.length + (open ? inactive.length : 0);

  grid.replaceChildren(...cards);
  grid.classList.toggle('single', cardCount === 1);
  countEl.textContent = cardCount;
  totalEl.textContent = all.length;
  emptyEl.classList.toggle('show', cardCount === 0);
}

/* =====================================================================
   עריכה + סיסמה
   ===================================================================== */
function startEditing(id){ editingId = id; render(); }
function stopEditing(){
  if(!editingId) return;
  editingId = null;
  render();
  toast('השינויים נשמרו');
}

function requireAuth(action){
  if(unlocked){ action(); return; }
  pendingAction = action;
  pwError.textContent = '';
  pwInput.value = '';
  pwModal.classList.add('show');
  setTimeout(() => pwInput.focus(), 30);
}
function closeModal(){
  pwModal.classList.remove('show');
  pendingAction = null;
}
function attemptUnlock(){
  if(pwInput.value === GATE_PASSWORD){
    unlocked = true;
    store.set(AUTH_KEY, 1, true);
    const action = pendingAction;
    closeModal();
    action?.();
  } else {
    pwError.textContent = 'סיסמה שגויה';
    pwInput.select();
  }
}
$('pwConfirm').addEventListener('click', attemptUnlock);
$('pwCancel').addEventListener('click', closeModal);
pwInput.addEventListener('keydown', e => { if(e.key === 'Enter') attemptUnlock(); });
pwModal.addEventListener('click', e => { if(e.target === pwModal) closeModal(); });

document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(pwModal.classList.contains('show')) closeModal();
  else if(editingId) stopEditing();
});

/* =====================================================================
   מצב תצוגה (רך / כהה)
   ===================================================================== */
const darkMq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
const isDark = () => ui.theme ? ui.theme === 'dark' : !!(darkMq && darkMq.matches);

function applyTheme(){
  const root = document.documentElement;
  if(ui.theme === 'dark' || ui.theme === 'light') root.setAttribute('data-theme', ui.theme);
  else root.removeAttribute('data-theme');
  const dark = isDark();
  themeBtn.innerHTML = (dark ? ICON.sun : ICON.moon) + `<span>${dark ? 'מצב בהיר' : 'מצב כהה'}</span>`;
  themeBtn.title = dark ? 'מעבר לתצוגה בהירה' : 'מעבר לתצוגה כהה';
}
themeBtn.addEventListener('click', () => {
  ui.theme = isDark() ? 'light' : 'dark';
  saveUi();
  applyTheme();
});
if(darkMq){
  const onSystemChange = () => { if(!ui.theme) applyTheme(); };
  if(darkMq.addEventListener) darkMq.addEventListener('change', onSystemChange);
  else if(darkMq.addListener) darkMq.addListener(onSystemChange);
}

/* =====================================================================
   כפתורי הכותרת
   ===================================================================== */
resetBtn.addEventListener('click', () => requireAuth(() => {
  if(!confirm('לאפס את כל השינויים והסימונים שבוצעו ולחזור לברירת המחדל?')) return;
  overrides = {};
  saveOverrides();
  editingId = null;
  render();
  toast('כל השינויים אופסו');
}));

/* ===================================================================== */
applyTheme();
render();
</script>
</body>
</html>
